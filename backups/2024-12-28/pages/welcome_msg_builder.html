<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>歡迎訊息設定</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">👋 歡迎訊息設定</h2>

    <!-- 訊息類型 -->
    <div class="mb-3">
      <label for="welcome-type" class="form-label">選擇訊息類型</label>
      <select id="welcome-type" class="form-select">
        <option value="text">文字訊息</option>
        <option value="imagemap">Imagemap 訊息</option>
        <option value="flex">圖文訊息</option>
        <!-- 可擴充更多 -->
      </select>
    </div>

    <!-- 動態欄位插入區 -->
    <div id="welcome-dynamic-fields" class="mb-3"></div>

    <!-- 預覽區 -->
    <div class="mb-3">
      <label class="form-label">✅ 已選擇訊息預覽</label>
      <div id="welcome-preview" class="border p-2 bg-light">尚未選擇</div>
    </div>

    <button id="save-welcome" class="btn btn-primary">💾 儲存歡迎訊息</button>
  </div>

  <script type="module" src="./js/welcome_message_builder.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 註冊與設定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">註冊 & 設定 Access Token</h2>

    <h3 class="mt-4 mb-3">個人基本資料</h3>

    <div class="mb-3">
      <label for="user-name" class="form-label">使用者名稱</label>
      <input type="text" id="user-name" class="form-control" placeholder="輸入你的名稱">
    </div>

    <div class="mb-3">
      <label for="user-email" class="form-label">Email</label>
      <input type="email" id="user-email" class="form-control" placeholder="輸入你的 Email">
    </div>

    <div class="mb-3">
      <label for="line-id" class="form-label">LINE 顯示名稱</label>
      <input type="text" id="line-id" class="form-control" placeholder="輸入你的 LINE 名稱">
    </div>

    <div class="mb-3">
      <label for="line-user-id" class="form-label">LINE User ID</label>
      <input type="text" id="line-user-id" class="form-control" placeholder="透過 LIFF 自動填入" readonly>
    </div>

    <button class="btn btn-success" id="save-profile">儲存個人資料</button>


    <hr>

    <h3 class="mt-4 mb-3">Line@ 專案資料</h3>

    <div class="card p-4 mb-4 shadow-sm">
      <div class="mb-3">
        <label for="project-select" class="form-label">選擇專案</label>
        <select id="project-select" class="form-select">
          <option selected disabled>請選擇專案</option>
        </select>
      </div>
      <div class="d-flex justify-content-end">
        <button class="btn btn-outline-primary me-2" id="edit-project" disabled>編輯</button>
        <button class="btn btn-outline-danger me-2" id="delete-project" disabled>刪除</button>
        <button class="btn btn-success" id="add-project">新增</button>
      </div>
    </div>

    <p id="status" class="fw-bold"></p>
  </div>

<!-- 新增專案 Modal -->
<div class="modal fade" id="add-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">新增專案</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="add-project-name" class="form-label">Line@ 名稱</label>
            <input type="text" id="add-project-name" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="add-project-token" class="form-label">LINE Message API Token</label>
            <input type="text" id="add-project-token" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="add-project-id" class="form-label">LINE ID</label>
            <input type="text" id="add-project-id" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="submit-add-project">加入</button>
        </div>
      </div>
    </div>
  </div>

<!-- 編輯專案 Modal -->
<div class="modal fade" id="edit-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">編輯專案</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="edit-project-name" class="form-label">Line@ 名稱</label>
            <input type="text" id="edit-project-name" class="form-control" readonly />
          </div>
          <div class="mb-3">
            <label for="edit-project-token" class="form-label">LINE Message API Token</label>
            <input type="text" id="edit-project-token" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="submit-edit-project">更新</button>
        </div>
      </div>
    </div>
  </div>

  
  <script src="js/profile.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

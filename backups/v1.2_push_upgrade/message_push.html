<!-- pages/message_push.html -->
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold">🚀 訊息發送</h2>
            <p class="text-muted">向特定會員或群組發送 Push 訊息</p>
        </div>
    </div>

    <div class="row">
        <!-- 左側：會員選擇 -->
        <div class="col-lg-5">
            <div class="card h-100 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0">1. 選擇接收者</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="member-search" class="form-control border-start-0 ps-0"
                                placeholder="搜尋姓名或標籤...">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                        <span class="small text-muted fw-bold">分眾篩選條件</span>
                        <div>
                            <button
                                class="btn btn-link btn-sm p-0 text-decoration-none me-2 global-select-all">全選所有</button>
                            <button
                                class="btn btn-link btn-sm p-0 text-decoration-none text-danger global-clear-all">全部清除</button>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <!-- Tag Multi-select -->
                        <div class="col-6">
                            <div class="dropdown">
                                <button
                                    class="btn btn-outline-secondary btn-sm w-100 dropdown-toggle text-start overflow-hidden"
                                    type="button" id="dropdownTags" data-bs-toggle="dropdown" aria-expanded="false"
                                    style="text-overflow: ellipsis; white-space: nowrap;">
                                    標籤篩選
                                </button>
                                <ul class="dropdown-menu p-3 shadow" aria-labelledby="dropdownTags" id="tag-filter-list"
                                    style="min-width: 200px; max-height: 250px; overflow-y: auto;">
                                    <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                                        <button class="btn btn-link btn-sm p-0 text-decoration-none select-all-btn"
                                            data-target="tag-filter-checkbox">全選</button>
                                        <button
                                            class="btn btn-link btn-sm p-0 text-decoration-none text-danger clear-all-btn"
                                            data-target="tag-filter-checkbox">清除</button>
                                    </div>
                                    <li class="small text-muted mb-1">載入中...</li>
                                </ul>
                            </div>
                        </div>
                        <!-- Gender Multi-select -->
                        <div class="col-6">
                            <div class="dropdown">
                                <button
                                    class="btn btn-outline-secondary btn-sm w-100 dropdown-toggle text-start overflow-hidden"
                                    type="button" id="dropdownGender" data-bs-toggle="dropdown" aria-expanded="false"
                                    style="text-overflow: ellipsis; white-space: nowrap;">
                                    性別篩選
                                </button>
                                <ul class="dropdown-menu p-3 shadow" aria-labelledby="dropdownGender"
                                    style="min-width: 150px;">
                                    <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                                        <button class="btn btn-link btn-sm p-0 text-decoration-none select-all-btn"
                                            data-target="gender-checkbox">全選</button>
                                        <button
                                            class="btn btn-link btn-sm p-0 text-decoration-none text-danger clear-all-btn"
                                            data-target="gender-checkbox">清除</button>
                                    </div>
                                    <li>
                                        <div class="form-check"><input class="form-check-input gender-checkbox"
                                                type="checkbox" value="male" id="g-male"><label
                                                class="form-check-label small" for="g-male">男性</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input gender-checkbox"
                                                type="checkbox" value="female" id="g-female"><label
                                                class="form-check-label small" for="g-female">女性</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input gender-checkbox"
                                                type="checkbox" value="other" id="g-other"><label
                                                class="form-check-label small" for="g-other">其他</label></div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <!-- Age Multi-select -->
                        <div class="col-6">
                            <div class="dropdown">
                                <button
                                    class="btn btn-outline-secondary btn-sm w-100 dropdown-toggle text-start overflow-hidden"
                                    type="button" id="dropdownAge" data-bs-toggle="dropdown" aria-expanded="false"
                                    style="text-overflow: ellipsis; white-space: nowrap;">
                                    年齡篩選
                                </button>
                                <ul class="dropdown-menu p-3 shadow" aria-labelledby="dropdownAge"
                                    style="min-width: 150px;">
                                    <div class="d-flex justify-content-between mb-2 pb-2 border-bottom">
                                        <button class="btn btn-link btn-sm p-0 text-decoration-none select-all-btn"
                                            data-target="age-checkbox">全選</button>
                                        <button
                                            class="btn btn-link btn-sm p-0 text-decoration-none text-danger clear-all-btn"
                                            data-target="age-checkbox">清除</button>
                                    </div>
                                    <li>
                                        <div class="form-check"><input class="form-check-input age-checkbox"
                                                type="checkbox" value="0-18" id="a-18"><label
                                                class="form-check-label small" for="a-18">18 歲以下</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input age-checkbox"
                                                type="checkbox" value="19-25" id="a-25"><label
                                                class="form-check-label small" for="a-25">19 - 25 歲</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input age-checkbox"
                                                type="checkbox" value="26-35" id="a-35"><label
                                                class="form-check-label small" for="a-35">26 - 35 歲</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input age-checkbox"
                                                type="checkbox" value="36-45" id="a-45"><label
                                                class="form-check-label small" for="a-45">36 - 45 歲</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input age-checkbox"
                                                type="checkbox" value="46+" id="a-46"><label
                                                class="form-check-label small" for="a-46">46 歲以上</label></div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <!-- Location Multi-select -->
                        <div class="col-6">
                            <div class="dropdown">
                                <button
                                    class="btn btn-outline-secondary btn-sm w-100 dropdown-toggle text-start overflow-hidden"
                                    type="button" id="dropdownLocation" data-bs-toggle="dropdown" aria-expanded="false"
                                    style="text-overflow: ellipsis; white-space: nowrap;">
                                    地區篩選
                                </button>
                                <ul class="dropdown-menu p-3 shadow" aria-labelledby="dropdownLocation"
                                    style="min-width: 250px; max-height: 300px; overflow-y: auto;">
                                    <div
                                        class="d-flex justify-content-between mb-2 pb-2 border-bottom sticky-top bg-white">
                                        <button class="btn btn-link btn-sm p-0 text-decoration-none select-all-btn"
                                            data-target="location-checkbox">全選</button>
                                        <button
                                            class="btn btn-link btn-sm p-0 text-decoration-none text-danger clear-all-btn"
                                            data-target="location-checkbox">清除</button>
                                    </div>
                                    <li class="small fw-bold text-muted border-bottom mb-2 pb-1">北部地區</li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="基隆市" id="l-kl"><label
                                                class="form-check-label small" for="l-kl">基隆市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="台北市" id="l-tp"><label
                                                class="form-check-label small" for="l-tp">台北市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="新北市" id="l-ntp"><label
                                                class="form-check-label small" for="l-ntp">新北市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="桃園市" id="l-ty"><label
                                                class="form-check-label small" for="l-ty">桃園市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="新竹市" id="l-hcc"><label
                                                class="form-check-label small" for="l-hcc">新竹市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="新竹縣" id="l-hch"><label
                                                class="form-check-label small" for="l-hch">新竹縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="宜蘭縣" id="l-il"><label
                                                class="form-check-label small" for="l-il">宜蘭縣</label></div>
                                    </li>

                                    <li class="small fw-bold text-muted border-bottom my-2 pb-1">中部地區</li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="苗栗縣" id="l-ml"><label
                                                class="form-check-label small" for="l-ml">苗栗縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="台中市" id="l-tc"><label
                                                class="form-check-label small" for="l-tc">台中市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="彰化縣" id="l-ch"><label
                                                class="form-check-label small" for="l-ch">彰化縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="南投縣" id="l-nt"><label
                                                class="form-check-label small" for="l-nt">南投縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="雲林縣" id="l-yl"><label
                                                class="form-check-label small" for="l-yl">雲林縣</label></div>
                                    </li>

                                    <li class="small fw-bold text-muted border-bottom my-2 pb-1">南部地區</li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="嘉義市" id="l-cyc"><label
                                                class="form-check-label small" for="l-cyc">嘉義市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="嘉義縣" id="l-cyh"><label
                                                class="form-check-label small" for="l-cyh">嘉義縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="台南市" id="l-tn"><label
                                                class="form-check-label small" for="l-tn">台南市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="高雄市" id="l-kh"><label
                                                class="form-check-label small" for="l-kh">高雄市</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="屏東縣" id="l-pt"><label
                                                class="form-check-label small" for="l-pt">屏東縣</label></div>
                                    </li>

                                    <li class="small fw-bold text-muted border-bottom my-2 pb-1">東部與離島</li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="花蓮縣" id="l-hl"><label
                                                class="form-check-label small" for="l-hl">花蓮縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="台東縣" id="l-tt"><label
                                                class="form-check-label small" for="l-tt">台東縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="澎湖縣" id="l-ph"><label
                                                class="form-check-label small" for="l-ph">澎湖縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="金門縣" id="l-km"><label
                                                class="form-check-label small" for="l-km">金門縣</label></div>
                                    </li>
                                    <li>
                                        <div class="form-check"><input class="form-check-input location-checkbox"
                                                type="checkbox" value="連江縣" id="l-lj"><label
                                                class="form-check-label small" for="l-lj">連江縣</label></div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="select-all-members">
                            <label class="form-check-label small text-muted" for="select-all-members">
                                全選 (已載入: <span id="loaded-count">0</span>)
                            </label>
                        </div>
                        <span class="badge bg-primary rounded-pill small" id="selected-count">已選 0 人</span>
                    </div>

                    <div class="member-list-container border rounded" style="max-height: 400px; overflow-y: auto;">
                        <ul class="list-group list-group-flush" id="member-list-display">
                            <li class="list-group-item text-center py-4 text-muted">載入會員中...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：訊息內容 -->
        <div class="col-lg-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0">2. 編輯訊息內容</h5>
                </div>
                <div class="card-body">
                    <!-- 訊息選擇器 (動態插入) -->
                    <div id="reply-dynamic-fields-container" class="mb-3">
                        <label class="form-label fw-semibold">選擇訊息內容</label>
                        <div id="reply-dynamic-fields">
                            <!-- 由 message.helper.js 動態生成 -->
                        </div>
                    </div>

                    <!-- 加入按鈕 -->
                    <div class="d-flex justify-content-end mb-4">
                        <button type="button" id="btn-add-push-message" class="btn btn-outline-primary shadow-sm">
                            <i class="bi bi-plus-lg"></i> 加入此訊息
                        </button>
                    </div>

                    <!-- 已加入的訊息清單 -->
                    <div class="mb-0">
                        <label class="form-label fw-semibold d-flex justify-content-between">
                            <span>已加入的訊息 (最多 5 則)</span>
                            <span class="badge bg-light text-dark border" id="push-msg-count">0 / 5</span>
                        </label>
                        <div id="push-message-display" class="border rounded p-3 bg-light" style="min-height: 150px;">
                            <div class="text-muted text-center py-4">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                尚未加入任何訊息
                            </div>
                        </div>
                        <div class="form-text mt-2">
                            💡 按照順序發送。LINE API 限制單次 Push 最多包含 5 則訊息。
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white py-3 text-end">
                    <button class="btn btn-secondary me-2" id="btn-clear-message">重設</button>
                    <button class="btn btn-primary px-4" id="btn-send-message">
                        <i class="bi bi-send-fill me-2"></i>發送訊息
                    </button>
                </div>
            </div>

            <!-- 發送狀態/歷史 -->
            <div class="card shadow-sm d-none" id="sending-status-card">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0">發送進度</h5>
                </div>
                <div class="card-body">
                    <div class="progress mb-3" style="height: 25px;">
                        <div id="send-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                            role="progressbar" style="width: 0%;">0%</div>
                    </div>
                    <div id="send-logs" class="small text-muted border rounded p-2 bg-light"
                        style="max-height: 150px; overflow-y: auto;">
                        等待發送...
                    </div>
                </div>
            </div>
        </div>
        <style>
            .push-msg-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px;
                background: white;
                border: 1px solid #dee2e6;
                border-radius: 8px;
                margin-bottom: 10px;
                transition: all 0.2s;
            }

            .push-msg-item:hover {
                border-color: #0d6efd;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }

            .push-msg-item .remove-btn {
                margin-left: auto;
            }
        </style>
    </div>
</div>

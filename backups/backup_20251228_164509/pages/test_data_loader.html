<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料載入測試</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>🧪 流程設計器資料載入測試</h1>

    <div id="status" class="status loading">
        ⏳ 正在載入模組...
    </div>

    <h2>測試結果：</h2>
    <div id="results"></div>

    <script type="module">
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        function log(message, type = 'info') {
            console.log(message);
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        async function runTests() {
            try {
                log('步驟 1: 載入 state.js...', 'loading');
                const { getUserId, apiBase } = await import('../helper/state.js');
                log(`✅ getUserId: ${getUserId()}`, 'success');
                log(`✅ apiBase: ${apiBase}`, 'success');

                log('步驟 2: 載入 toast.js...', 'loading');
                const { toast } = await import('../helper/toast.js');
                log('✅ Toast 載入成功', 'success');

                log('步驟 3: 載入 message.helper.js...', 'loading');
                const messageHelper = await import('../helper/message.helper.js');
                log('✅ Message Helper 載入成功', 'success');

                log('步驟 4: 載入 flow_designer_data_loader.js...', 'loading');
                const { dataLoader } = await import('../js/flow_designer_data_loader.js');
                log('✅ Data Loader 載入成功', 'success');

                statusDiv.textContent = '✅ 所有模組載入成功！';
                statusDiv.className = 'status success';

                // 等待 2 秒讓資料載入
                log('等待資料載入...', 'loading');
                await new Promise(resolve => setTimeout(resolve, 3000));

                // 顯示快取資料
                log('步驟 5: 檢查快取資料...', 'loading');
                const cache = dataLoader.cache;

                const resultsPre = document.createElement('pre');
                resultsPre.textContent = JSON.stringify({
                    richmenus: cache.richmenus?.length || 0,
                    flexMessages: cache.flexMessages?.length || 0,
                    imagemaps: cache.imagemaps?.length || 0,
                    keywords: cache.keywords?.length || 0,
                    projects: cache.projects?.length || 0
                }, null, 2);
                resultsDiv.appendChild(resultsPre);

                log(`✅ Richmenu: ${cache.richmenus?.length || 0} 個`, 'success');
                log(`✅ Flex Message: ${cache.flexMessages?.length || 0} 個`, 'success');
                log(`✅ Imagemap: ${cache.imagemaps?.length || 0} 個`, 'success');
                log(`✅ 關鍵字: ${cache.keywords?.length || 0} 個`, 'success');
                log(`✅ 專案: ${cache.projects?.length || 0} 個`, 'success');

            } catch (err) {
                log(`❌ 錯誤: ${err.message}`, 'error');
                log(`詳細錯誤: ${err.stack}`, 'error');
                statusDiv.textContent = '❌ 載入失敗！請查看下方錯誤訊息';
                statusDiv.className = 'status error';
            }
        }

        // 執行測試
        runTests();
    </script>
</body>

</html>

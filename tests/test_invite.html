<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邀請測試頁面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3>邀請 API 測試</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Token:</label>
                    <input type="text" class="form-control" id="token-input"
                        value="f92f3069-6882-4549-8bfb-2e1d57cbbaa1">
                </div>
                <button class="btn btn-primary" onclick="testInvite()">測試接受邀請</button>
                <hr>
                <h5>結果：</h5>
                <pre id="result" class="bg-dark text-light p-3" style="min-height: 200px;"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8787';

        async function testInvite() {
            const token = document.getElementById('token-input').value;
            const resultEl = document.getElementById('result');

            resultEl.textContent = '正在測試...\n';

            try {
                resultEl.textContent += `API URL: ${API_BASE}/team/invite/accept\n`;
                resultEl.textContent += `Token: ${token}\n\n`;

                const response = await fetch(`${API_BASE}/team/invite/accept`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        userId: 'U_test_' + Date.now(),
                        displayName: '測試用戶',
                        pictureUrl: ''
                    })
                });

                resultEl.textContent += `Status: ${response.status} ${response.statusText}\n`;
                resultEl.textContent += `Headers: ${JSON.stringify([...response.headers.entries()], null, 2)}\n\n`;

                const data = await response.json();
                resultEl.textContent += `Response:\n${JSON.stringify(data, null, 2)}`;

                if (response.ok) {
                    resultEl.textContent += '\n\n✅ 成功！';
                } else {
                    resultEl.textContent += '\n\n❌ 失敗';
                }
            } catch (error) {
                resultEl.textContent += `\n\n❌ 錯誤: ${error.message}\n`;
                resultEl.textContent += `Stack: ${error.stack}`;
            }
        }
    </script>
</body>

</html>

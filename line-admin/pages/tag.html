<!-- tag.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>標籤管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-4">🔖 標籤管理</h2>

    <!-- 新增標籤 -->
    <div class="input-group mb-3">
      <input type="text" id="tag-input" class="form-control" placeholder="輸入新標籤名稱">
      <button id="add-tag-btn" class="btn btn-primary">新增標籤</button>
    </div>

    <!-- 多選刪除區塊 -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div>
        <input type="checkbox" id="select-all-checkbox"> 全選
      </div>
      <button id="delete-selected-tags" class="btn btn-danger btn-sm">刪除選取標籤</button>
    </div>

    <!-- 標籤清單 -->
    <table class="table table-bordered">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all-tags"></th>
          <th>標籤名稱</th>
          <th>關聯數量</th>
        </tr>
      </thead>
      <tbody id="tag-list">
        <!-- JS 動態插入 -->
      </tbody>
    </table>
  </div>

  <script type="module" src="../js/tag.js"></script>
</body>
</html>

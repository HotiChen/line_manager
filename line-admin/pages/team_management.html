<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">團隊成員管理</h2>
            <p class="text-muted mb-0" id="current-bot-name">載入中...</p>
        </div>
        <button class="btn btn-primary" id="btn-invite-member">
            <i class="bi bi-person-plus-fill me-2"></i>邀請成員
        </button>
    </div>

    <!-- Member List -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3">成員</th>
                            <th>角色</th>
                            <th>加入時間</th>
                            <th>加入方式</th>
                            <th class="text-end pe-4">操作</th>
                        </tr>
                    </thead>
                    <tbody id="member-list-body">
                        <!-- Dynamic Content -->
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                載入成員列表中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Invite Modal -->
<div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">邀請新成員</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">設定角色</label>
                    <select class="form-select" id="invite-role">
                        <option value="member">成員 (Member)</option>
                        <option value="owner">管理員 (Owner)</option>
                    </select>
                    <div class="form-text">成員可以編輯內容，但不能管理團隊成員。</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">選擇專案 (Line@)</label>
                    <div id="project-selection-area" class="border rounded p-3"
                        style="max-height: 150px; overflow-y: auto;">
                        <div class="text-center text-muted small">載入專案中...</div>
                    </div>
                    <div class="form-text">被邀請者將獲得以上勾選專案的存取權限。</div>
                </div>

                <div id="invite-result" class="d-none">
                    <label class="form-label">邀請連結</label>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="invite-link" readonly>
                        <button class="btn btn-outline-secondary" type="button" id="btn-copy-link">
                            <i class="bi bi-clipboard"></i> 複製
                        </button>
                        <button class="btn btn-outline-success" type="button" id="btn-share-link">
                            <i class="bi bi-share-fill"></i> 分享
                        </button>
                    </div>
                    <div class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle-fill me-2"></i>連結已產生！請將此連結傳送給邀請對象。連結將在 24 小時後失效。
                    </div>
                </div>

                <div id="invite-loading" class="text-center py-3 d-none">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted small">正在產生連結...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
                <button type="button" class="btn btn-primary" id="btn-generate-link">分享邀請</button>
            </div>
        </div>
    </div>
</div>

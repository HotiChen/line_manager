<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Tags empty state - Labels/Tags theme -->
  <g id="empty-tags">
    <!-- Background circle -->
    <circle cx="150" cy="150" r="120" fill="#F5F5F5" opacity="0.3"/>
    
    <!-- Tag 1 (large, center) -->
    <g transform="rotate(-10 150 130)">
      <path d="M 100 120 L 180 120 L 195 135 L 180 150 L 100 150 L 100 120 Z" fill="#06C755"/>
      <circle cx="190" cy="135" r="5" fill="white"/>
    </g>
    
    <!-- Tag 2 (medium, top right) -->
    <g transform="rotate(15 180 100)">
      <path d="M 145 90 L 205 90 L 215 100 L 205 110 L 145 110 L 145 90 Z" fill="#667eea" opacity="0.8"/>
      <circle cx="210" cy="100" r="4" fill="white"/>
    </g>
    
    <!-- Tag 3 (small, bottom left) -->  
    <g transform="rotate(-20 110 170)">
      <path d="M 85 160 L 130 160 L 138 170 L 130 180 L 85 180 L 85 160 Z" fill="#E5E5E5"/>
      <circle cx="134" cy="170" r="3" fill="#999"/>
    </g>
  </g>
</svg>

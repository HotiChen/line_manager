<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Richmenu empty state - Menu grid theme -->
  <g id="empty-richmenu">
    <!-- Background circle -->
    <circle cx="150" cy="150" r="120" fill="#F5F5F5" opacity="0.3"/>
    
    <!-- Menu grid (3x2) -->
    <!-- Row 1 -->
    <rect x="85" y="95" width="50" height="45" rx="8" fill="#E5E5E5" stroke="#CCC" stroke-width="2"/>
    <rect x="145" y="95" width="50" height="45" rx="8" fill="#06C755" stroke="#06C755" stroke-width="2"/>
    <rect x="205" y="95" width="50" height="45" rx="8" fill="#E5E5E5" stroke="#CCC" stroke-width="2"/>
    
    <!-- Row 2 -->
    <rect x="85" y="150" width="50" height="45" rx="8" fill="#E5E5E5" stroke="#CCC" stroke-width="2"/>
    <rect x="145" y="150" width="50" height="45" rx="8" fill="#667eea" stroke="#667eea" stroke-width="2" opacity="0.7"/>
    <rect x="205" y="150" width="50" height="45" rx="8" fill="#E5E5E5" stroke="#CCC" stroke-width="2"/>
    
    <!-- Glowing effect on highlighted -->
    <circle cx="170" cy="117" r="28" fill="#06C755" opacity="0.1"/>
    <circle cx="170" cy="172" r="28" fill="#667eea" opacity="0.1"/>
  </g>
</svg>

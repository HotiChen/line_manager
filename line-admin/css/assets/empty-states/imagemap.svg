<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Imagemap Builder empty state - Image upload theme -->
  <g id="empty-imagemap">
    <!-- Background circle -->
    <circle cx="150" cy="150" r="120" fill="#F5F5F5" opacity="0.3"/>
    
    <!-- Image frame -->
    <rect x="90" y="100" width="120" height="100" rx="8" fill="white" stroke="#CCC" stroke-width="3"/>
    <rect x="95" y="105" width="110" height="90" rx="4" fill="#F9F9F9" stroke="#DDD" stroke-width="1"/>
    
    <!-- Mountain/image icon inside frame -->
    <path d="M 105 165 L 125 145 L 145 165 L 175 135 L 195 155 L 195 185 L 105 185 Z" fill="#E5E5E5"/>
    <circle cx="175" cy="125" r="8" fill="#FFD700" opacity="0.6"/>
    
    <!-- Upload cloud icon -->
    <g transform="translate(140, 95)">
      <circle cx="20" cy="50" r="30" fill="#06C755" opacity="0.2"/>
      <!-- Cloud -->
      <path d="M 10 45 Q 8 40, 12 37 Q 12 32, 18 30 Q 22 28, 26 30 Q 30 28, 34 32 Q 38 35, 36 40 Q 40 42, 38 47 L 10 47 Q 8 45, 10 45 Z" fill="#06C755"/>
      <!-- Arrow up -->
      <path d="M 23 40 L 23 52 M 19 44 L 23 40 L 27 44" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

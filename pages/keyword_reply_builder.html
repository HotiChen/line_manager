<!-- 關鍵字自動回覆頁面 -->
<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">
      <!-- 標題列 -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="mb-1"><i class="bi bi-chat-dots text-primary"></i> 關鍵字自動回覆</h4>
          <p class="text-muted mb-0">設定關鍵字觸發自動回覆訊息</p>
        </div>
        <button type="button" class="btn btn-primary" id="create-keyword-btn">
          <i class="bi bi-plus-lg"></i> 新增關鍵字
        </button>
      </div>

      <!-- 關鍵字列表 -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-collection"></i> 已儲存的關鍵字</span>
          <div class="d-flex gap-2">
            <button id="delete-selected-btn" class="btn btn-danger btn-sm">
              <i class="bi bi-trash"></i> 刪除選取
            </button>
            <button class="btn btn-sm btn-outline-primary" id="refresh-stats-btn">
              <i class="bi bi-arrow-clockwise"></i> 刷新統計
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- 搜尋區域 -->
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="keyword-search" class="form-control" placeholder="搜尋關鍵字或回覆類型...">
              <button class="btn btn-outline-secondary" type="button" id="clear-search">清除</button>
            </div>
            <small class="text-muted" id="search-result-count"></small>
          </div>

          <!-- 關鍵字表格 -->
          <table class="table table-bordered keyword-table">
            <thead>
              <tr>
                <th style="width: 40px;"><input type="checkbox" id="select-all-checkbox" /></th>
                <th>關鍵字</th>
                <th>回覆類型</th>
                <th class="stats-cell text-center" style="width: 100px;">總觸發</th>
                <th class="stats-cell text-center" style="width: 80px;">本月</th>
                <th class="stats-cell text-center" style="width: 80px;">上月</th>
              </tr>
            </thead>
            <tbody id="reply-list">
              <!-- 由 JS 動態插入 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/編輯關鍵字 Modal -->
<div class="modal fade" id="keyword-modal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="keyword-modal-title">
          <i class="bi bi-chat-dots text-primary"></i> 新增關鍵字
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- 關鍵字輸入 -->
        <div class="mb-3">
          <label class="form-label">關鍵字 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="keyword-input" placeholder="例如：你好,嗨,哈囉（用逗號分隔）">
          <small class="text-muted">可用逗號分隔設定多個觸發關鍵字</small>
        </div>

        <!-- 回覆選擇區 -->
        <div class="mb-3">
          <label class="form-label">選擇回覆內容</label>
          <div id="reply-dynamic-fields">
            <!-- JS 動態插入回覆類型選擇器 -->
          </div>
        </div>

        <!-- 加入回覆按鈕 -->
        <div class="d-flex justify-content-end mb-3">
          <button type="button" id="add-reply-btn" class="btn btn-outline-primary">
            <i class="bi bi-plus"></i> 加入回覆
          </button>
        </div>

        <!-- 已加入的回覆 -->
        <div class="mb-3">
          <label class="form-label">已加入的回覆</label>
          <div id="selected-reply-display" class="border rounded p-3 bg-light">
            <div class="text-muted text-center">
              <i class="bi bi-inbox"></i> 尚未加入回覆
            </div>
          </div>
        </div>

        <!-- Quick Reply 選擇區 -->
        <div class="mb-3">
          <label class="form-label">
            <i class="bi bi-lightning-charge text-warning"></i> 附加 Quick Reply 到回覆
          </label>
          <div class="input-group">
            <select id="qr-template-select" class="form-select">
              <option value="">-- 不附加 --</option>
              <!-- JS 動態載入 QR 模板 -->
            </select>
            <button type="button" class="btn btn-outline-secondary" id="preview-qr-btn">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <small class="text-muted">選擇後點「加入回覆」，QR 會附加到該回覆上</small>
          <!-- QR 預覽區 -->
          <div id="qr-preview-area" class="mt-2" style="display: none;">
            <div class="border rounded p-2 bg-white">
              <div class="d-flex flex-wrap gap-1" id="qr-buttons-preview">
                <!-- JS 動態顯示 QR 按鈕預覽 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 自動標籤設定 -->
        <div class="mb-3 border-top pt-3">
          <label class="form-label">
            <i class="bi bi-tags text-info"></i> 自動標籤設定 (Automatic Tagging)
          </label>
          <div class="row g-2">
            <div class="col-6">
              <label class="small text-muted mb-1">觸發後添加標籤</label>
              <input type="text" class="form-control form-control-sm" id="keyword-add-tags" placeholder="VIP, 潛在客戶">
            </div>
            <div class="col-6">
              <label class="small text-muted mb-1">觸發後移除標籤</label>
              <input type="text" class="form-control form-control-sm" id="keyword-remove-tags" placeholder="新手">
            </div>
          </div>
          <div class="form-text mt-1">
            <i class="bi bi-info-circle"></i> 當使用者觸發此關鍵字時，會自動更新其標籤。若有多個請用逗號分隔。
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-success" id="save-keyword-btn">
          <i class="bi bi-check-lg"></i> 儲存
        </button>
      </div>
    </div>
  </div>
</div>

<!-- CSS 樣式 -->
<style>
  .keyword-table th {
    background-color: #f8f9fa;
    font-weight: 600;
  }

  .stats-cell {
    text-align: center;
    vertical-align: middle;
  }

  .stats-badge {
    font-size: 0.8em;
    min-width: 40px;
    text-align: center;
  }

  .reply-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: white;
    border: 1px solid #e9ecef;
    border-radius: 6px;
    margin-bottom: 8px;
  }

  .reply-item:hover {
    border-color: #0d6efd;
  }

  .reply-item .remove-btn {
    margin-left: auto;
  }
</style>

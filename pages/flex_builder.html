<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <title>Flex Message Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    #json-input {
      height: 300px;
    }

    #preview-area {
      width: 100%;
      min-height: 480px;
      background-color: #f8f9fa;
      padding: 20px;
      display: flex;
      justify-content: center;
      border: 2px dashed #bbb;
      transition: border-color 0.2s ease-in-out;
      opacity: 1 !important;
    }

    #preview-area * {
      opacity: 1 !important;
    }

    #preview-area .chatbox {
      background-color: #ffffff !important;
    }

    #preview-area.border-primary {
      border-color: #007bff !important;
    }

    #preview-area>div {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
    }

    #editor-panel {
      background: #ffffff;
      border: 2px dashed #cde4ff;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.1);
      padding: 20px;
      transition: all 0.3s ease-in-out;
    }

    #editor-panel label {
      font-weight: 600;
      color: #1d4ed8;
    }

    #editor-panel input[type="text"],
    #editor-panel select,
    #editor-panel input[type="color"] {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    #editor-panel input[type="color"] {
      padding: 0.25rem;
      height: 40px;
    }

    #apply-props {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }

    #apply-props:hover {
      background-color: #2563eb;
    }

    .swiper-container {
      max-width: 1200px;
      border-radius: .375rem;
      background-color: #f8f9fa;
      overflow: hidden;
    }

    .card {
      user-select: none;
    }

    .flex-highlight {
      outline: 2px solid #4f46e5;
      outline-offset: -2px;
      cursor: pointer;
    }

    .hover-highlight {
      outline: 2px dashed #007bff !important;
      outline-offset: 2px;
      background-color: transparent !important;
      color: inherit !important;
      cursor: pointer;
    }

    /* 確保 Flex Message 文字顯示正常 */
    #preview-area .MdTxt {
      opacity: 1 !important;
    }

    #preview-area .MdSpn {
      opacity: 1 !important;
    }

    #preview-area .MdBtn {
      opacity: 1 !important;
    }

    #preview-area .MdBtn a {
      opacity: 1 !important;
    }

    /* 修復文字顏色繼承問題 */

    /* 修復按鈕文字顏色 */
    #preview-area .MdBtn.ExBtn1 a {
      color: #ffffff !important;
    }

    #preview-area .MdBtn.ExBtn2 a {
      color: #111111 !important;
    }

    #preview-area .MdBtn.ExBtnL a {
      color: #42659a !important;
    }

    /* 修復次要文字顏色 */
    #preview-area .MdTxt.Ex2nd {
      color: #444444 !important;
    }

    /* NEW: Add a border to the active swiper slide */
    .swiper-slide-active .lyItem {
      /* Create a gap between the element and the highlight */
      outline: 3px solid #0d6efd;
      outline-offset: 4px;
      /* The gap */

      /* Add a glowing effect */
      box-shadow: 0 0 12px rgba(13, 110, 253, 0.7);
    }
  </style>
  <style>

  </style>
</head>

<body>
  <div class="container-fluid py-4">
    <!-- 標題列 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="mb-1"><i class="bi bi-chat-square-text text-primary"></i> Flex Message 編輯</h4>
        <p class="text-muted mb-0">新增、管理與設定您的 Flex Message</p>
      </div>
      <div class="d-flex gap-2">
        <button id="new-flex-btn" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> 新增 Flex
        </button>
        <button id="sync-flex-btn" class="btn btn-outline-success">
          <i class="bi bi-cloud-upload"></i> 同步
        </button>
        <button id="clear-cache-btn" class="btn btn-outline-warning">
          <i class="bi bi-arrow-repeat"></i> 清快取
        </button>
      </div>
    </div>

    <div class="row">
      <!-- 左側：Flex 列表 -->
      <div class="col-md-3">
        <div class="card d-flex flex-column" style="height: 80vh;">
          <div class="card-header d-flex justify-content-between align-items-center flex-shrink-0">
            <h6 class="card-title mb-0"><i class="bi bi-collection"></i> 已儲存的 Flex</h6>
            <div class="btn-group btn-group-sm">
              <button id="clone-list-item-btn" class="btn btn-outline-primary" disabled title="複製">
                <i class="bi bi-copy"></i>
              </button>
              <button id="delete-flex-btn" class="btn btn-outline-danger" disabled title="刪除">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
          <div class="card-body p-2" style="flex: none;">
            <!-- 搜尋區域 -->
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="flex-search" class="form-control" placeholder="搜尋名稱...">
              <button class="btn btn-outline-secondary" type="button" id="clear-flex-search">清除</button>
            </div>
            <small class="text-muted" id="flex-search-result-count"></small>
          </div>
          <div class="card-body overflow-auto flex-grow-1" id="saved-flex-list" style="padding: 0.5rem;">
            <!-- 列表由 JS 動態插入 -->
          </div>
        </div>
      </div>

      <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <label class="form-label fw-bold mb-0">Flex 名稱：</label>
            <input type="text" id="flex-name" class="form-control" style="width: 300px;" placeholder="請輸入 Flex 名稱">
            <span id="save-status" class="d-none"></span>
          </div>
          <div>
            <span>目前 Bubble 數量：<span id="bubble-count">0</span></span>
          </div>
        </div>
        <!-- Swiper -->
        <div class="swiper-outer-container">
          <div class="swiper-container flex-preview-wrapper">
            <div class="swiper-wrapper" id="nameCardContainer">
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button id="add-bubble-btn" class="btn btn-outline-primary">➕ 新增 Bubble</button>
          <button id="clone-flex-btn" class="btn btn-outline-secondary">📄 複製 Bubble</button>
          <button id="delete-bubble-btn" class="btn btn-outline-danger">➖ 刪除 Bubble</button>
          <button id="update-list-btn" class="btn btn-success">💾 儲存修改</button>
          <button id="json-io-btn" class="btn btn-outline-info">🔄 JSON</button>
        </div>
        <!-- Swiper End -->
      </div>
    </div>
  </div>

  <!-- Flex Template Modal -->
  <div class="modal fade" id="templateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">選擇 Flex 樣板</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="template-page-number" class="text-muted small ms-3"></div>
          <div class="template-swiper">
            <div class="swiper-wrapper" id="template-swiper-wrapper">
            </div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="insert-template-btn" class="btn btn-primary">加入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 編輯 Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">編輯元件</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body bg-light">

          <!-- Component Properties -->
          <div class="card mb-3">
            <div class="card-body">
              <h6 class="card-title">元件屬性</h6>
              <div id="text-panel" class="d-none">
                <div class="mb-2">
                  <label class="form-label">文字內容</label>
                  <input type="text" class="form-control" id="modal-text">
                </div>
                <div class="mb-2">
                  <label class="form-label">文字顏色</label>
                  <input type="color" class="form-control form-control-color" id="modal-color" />
                </div>
              </div>
              <div id="image-panel" class="d-none">
                <div class="mb-2">
                  <label class="form-label">圖片網址</label>
                  <input type="text" class="form-control" id="image-url" />
                </div>
                <div class="mb-2">
                  <label class="form-label">或上傳圖片</label>
                  <div class="input-group">
                    <input type="file" class="form-control" id="image-upload-input" accept="image/png, image/jpeg">
                    <button class="btn btn-outline-secondary" type="button" id="upload-image-btn">上傳</button>
                  </div>
                </div>
              </div>
              <div id="button-panel" class="d-none">
                <div class="mb-2">
                  <label class="form-label">按鈕文字</label>
                  <input type="text" class="form-control" id="modal-button-label">
                </div>
                <div class="mb-2">
                  <label class="form-label">文字顏色</label>
                  <input type="color" class="form-control form-control-color" id="modal-button-text-color" />
                </div>
              </div>
            </div>
          </div>

          <!-- Action Properties -->
          <div id="action-panel-card" class="card d-none">
            <div class="card-body">
              <h6 class="card-title">點擊動作</h6>
              <div id="action-panel">
                <div class="mb-2">
                  <label class="form-label">Action Type</label>
                  <select id="action-type" class="form-select">
                    <option value="none">無</option>
                    <option value="uri">uri</option>
                    <option value="message">message</option>
                    <option value="postback">postback</option>
                  </select>
                </div>
                <div id="action-properties-container">
                  <div class="mb-2">
                    <label class="form-label">Label</label>
                    <input type="text" class="form-control" id="action-label" />
                  </div>
                  <div class="mb-2">
                    <label id="action-uri-label" class="form-label">URI</label>
                    <input type="text" class="form-control" id="action-uri" />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Tag Management -->
          <div id="tag-management-card" class="card">
            <div class="card-body">
              <h6 class="card-title">元件標籤 (Tags)</h6>
              <div class="input-group">
                <select class="form-select" id="modal-tag-select">
                  <!-- Options will be populated by JavaScript -->
                </select>
                <button class="btn btn-outline-primary" type="button" id="add-tag-to-component-btn">加入</button>
              </div>
              <div id="tag-pills-container" class="mt-2 d-flex flex-wrap gap-2">
                <!-- Tag pills will be rendered here -->
              </div>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="save-modal">儲存變更</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- html2canvas for generating thumbnails -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="../js/flex2html.js"></script>
  <script type="module" src="../js/flex_builder.js"></script>

  <!-- 新增 Flex Message Modal -->
  <div class="modal fade" id="newFlexModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">創立新 Flex Message</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Flex 名稱</label>
          <input type="text" class="form-control" id="new-flex-name" placeholder="請輸入名稱" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary" id="create-flex-btn">建立</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JSON Import/Export Modal -->
  <div class="modal fade" id="json-io-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">匯入 / 匯出 Flex Message JSON</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">您可以在下方編輯 JSON，完成後按「確定更新」來刷新預覽。您也可以直接「複製」目前的 JSON 內容。</p>
          <textarea id="json-io-textarea" class="form-control" rows="15"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-outline-primary" id="copy-json-btn">複製</button>
          <button type="button" class="btn btn-primary" id="update-json-btn">確定更新</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>

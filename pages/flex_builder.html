<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Flex Message Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    #json-input { height: 300px; }
    #preview-area {
      width: 100%;
      min-height: 480px;
      background-color: #f8f9fa;
      padding: 20px;
      display: flex;
      justify-content: center;
      border: 2px dashed #bbb;
      transition: border-color 0.2s ease-in-out;
      opacity: 1 !important;
    }
    #preview-area * {
      opacity: 1 !important;
    }
    #preview-area .chatbox {
      background-color: #ffffff !important;
    }
    #preview-area.border-primary {
      border-color: #007bff !important;
    }
    #preview-area > div {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
    }
    #editor-panel {
      background: #ffffff;
      border: 2px dashed #cde4ff;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.1);
      padding: 20px;
      transition: all 0.3s ease-in-out;
    }
    #editor-panel label {
      font-weight: 600;
      color: #1d4ed8;
    }
    #editor-panel input[type="text"],
    #editor-panel select,
    #editor-panel input[type="color"] {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    #editor-panel input[type="color"] {
      padding: 0.25rem;
      height: 40px;
    }
    #apply-props {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }
    #apply-props:hover {
      background-color: #2563eb;
    }
    .swiper-container {
      max-width: 1200px;
      border: 1px solid #dee2e6;
      border-radius: .375rem;
      background-color: #f8f9fa;
      overflow: hidden;
    }
    .card {
      user-select: none;
    }
    .flex-highlight {
      outline: 2px solid #4f46e5;
      outline-offset: -2px;
      cursor: pointer;
    }
    .hover-highlight {
      outline: 2px dashed #007bff !important;
      outline-offset: 2px;
      background-color: transparent !important;
      color: inherit !important;
      cursor: pointer;
    }
    
    /* 確保 Flex Message 文字顯示正常 */
    #preview-area .MdTxt {
      opacity: 1 !important;
    }
    
    #preview-area .MdSpn {
      opacity: 1 !important;
    }
    
    #preview-area .MdBtn {
      opacity: 1 !important;
    }
    
    #preview-area .MdBtn a {
      opacity: 1 !important;
    }
    
    /* 修復文字顏色繼承問題 */
    
    /* 修復按鈕文字顏色 */
    #preview-area .MdBtn.ExBtn1 a {
      color: #ffffff !important;
    }
    
    #preview-area .MdBtn.ExBtn2 a {
      color: #111111 !important;
    }
    
    #preview-area .MdBtn.ExBtnL a {
      color: #42659a !important;
    }
    
    /* 修復次要文字顏色 */
    #preview-area .MdTxt.Ex2nd {
      color: #444444 !important;
    }

    /* NEW: Add a border to the active swiper slide */
    .swiper-slide-active .lyItem {
      /* Create a gap between the element and the highlight */
      outline: 3px solid #0d6efd;
      outline-offset: 4px; /* The gap */

      /* Add a glowing effect */
      box-shadow: 0 0 12px rgba(13, 110, 253, 0.7);
    }
 
  </style>
  <style>
 
  </style>
</head>
<body>
  <div class="container">
    <!-- 標題與說明 -->
    <div class="container mt-5 mb-4">
      <h2 class="mb-4">Flex Message 編輯</h2>
      <p class="lead">新增、管理與設定您的 Flex Message</p>
    </div>
    <div class="row">
      <div class="col-md-3">
        <button id="new-flex-btn" class="btn btn-primary btn-block mt-3">➕ 新增 Flex</button>
              <!-- 新增已儲存 Flex 預覽清單 -->
        <div class="container mt-4">
          <h5>📂 已儲存 Flex</h5>
          <div class="mb-2">
            <label for="flex-select" class="form-label">選擇 Flex：</label>
            <select id="flex-select" class="form-select">
              <option value="">請選擇</option>
              <!-- JS 動態插入選項 -->
            </select>
          </div>
          
          <div id="saved-flex-list" class="border rounded p-2 bg-light" style="max-height: 280px; overflow-y: auto;">

          </div>
          <div class="d-grid gap-2 mt-2">
            <button id="clone-list-item-btn" class="btn btn-info" disabled>📄 複製現在 flex</button>
            <button id="delete-flex-btn" class="btn btn-danger" disabled>🗑️ 從列表刪除</button>
            <button id="sync-flex-btn" class="btn btn-success">☁️ 上傳變更到後台</button>
            <button id="clear-cache-btn" class="btn btn-warning">🧹 清除快取</button>
          </div>
        </div>
      </div>

      <div class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <label class="form-label fw-bold">Flex 名稱：</label>
            <input type="text" id="flex-name" class="form-control" placeholder="請輸入 Flex 名稱">
          </div>
          <div>
            <span>目前 Bubble 數量：<span id="bubble-count">0</span></span>
          </div>
        </div>
      <!-- Swiper -->
      <div class="swiper-outer-container">
        <div class="swiper-container flex-preview-wrapper">
          <div class="swiper-wrapper" id="nameCardContainer">
          </div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button id="add-bubble-btn" class="btn btn-primary">➕ 新增 Bubble</button>
        <button id="clone-flex-btn" class="btn btn-secondary btn-block">📄 複製目前 Bubble</button>
        <button id="delete-bubble-btn" class="btn btn-danger">➖ 刪除目前 Bubble</button>
        <button id="update-list-btn" class="btn btn-primary">💾 更新到列表</button>
        <button id="json-io-btn" class="btn btn-info">🔄 匯入/匯出 JSON</button>
      </div>
      <!-- Swiper End -->
      </div>
    </div>
  </div>

  <!-- Flex Template Modal -->
<div class="modal fade" id="templateModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">選擇 Flex 樣板</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="template-page-number" class="text-muted small ms-3"></div>
        <div class="template-swiper">
          <div class="swiper-wrapper" id="template-swiper-wrapper">
          </div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="insert-template-btn" class="btn btn-primary">加入</button>
      </div>
    </div>
  </div>
</div>

  <!-- 編輯 Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">編輯元件</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body bg-light">

          <!-- Component Properties -->
          <div class="card mb-3">
            <div class="card-body">
              <h6 class="card-title">元件屬性</h6>
              <div id="text-panel" class="d-none">
                <div class="mb-2">
                  <label class="form-label">文字內容</label>
                  <input type="text" class="form-control" id="modal-text">
                </div>
                <div class="mb-2">
                  <label class="form-label">文字顏色</label>
                  <input type="color" class="form-control form-control-color" id="modal-color" />
                </div>
              </div>
              <div id="image-panel" class="d-none">
                <div class="mb-2">
                  <label class="form-label">圖片網址</label>
                  <input type="text" class="form-control" id="image-url" />
                </div>
                <div class="mb-2">
                  <label class="form-label">或上傳圖片</label>
                  <div class="input-group">
                    <input type="file" class="form-control" id="image-upload-input" accept="image/png, image/jpeg">
                    <button class="btn btn-outline-secondary" type="button" id="upload-image-btn">上傳</button>
                  </div>
                </div>
              </div>
              <div id="button-panel" class="d-none">
                <div class="mb-2">
                  <label class="form-label">按鈕文字</label>
                  <input type="text" class="form-control" id="modal-button-label">
                </div>
                <div class="mb-2">
                  <label class="form-label">文字顏色</label>
                  <input type="color" class="form-control form-control-color" id="modal-button-text-color" />
                </div>
              </div>
            </div>
          </div>

          <!-- Action Properties -->
          <div id="action-panel-card" class="card d-none">
            <div class="card-body">
              <h6 class="card-title">點擊動作</h6>
              <div id="action-panel">
                  <div class="mb-2">
                    <label class="form-label">Action Type</label>
                    <select id="action-type" class="form-select">
                      <option value="none">無</option>
                      <option value="uri">uri</option>
                      <option value="message">message</option>
                      <option value="postback">postback</option>
                    </select>
                  </div>
                  <div id="action-properties-container">
                    <div class="mb-2">
                      <label class="form-label">Label</label>
                      <input type="text" class="form-control" id="action-label" />
                    </div>
                    <div class="mb-2">
                      <label id="action-uri-label" class="form-label">URI</label>
                      <input type="text" class="form-control" id="action-uri" />
                    </div>
                  </div>
              </div>
            </div>
          </div>

          <!-- Tag Management -->
          <div id="tag-management-card" class="card">
            <div class="card-body">
              <h6 class="card-title">元件標籤 (Tags)</h6>
              <div class="input-group">
                <select class="form-select" id="modal-tag-select">
                  <!-- Options will be populated by JavaScript -->
                </select>
                <button class="btn btn-outline-primary" type="button" id="add-tag-to-component-btn">加入</button>
              </div>
              <div id="tag-pills-container" class="mt-2 d-flex flex-wrap gap-2">
                <!-- Tag pills will be rendered here -->
              </div>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="save-modal">儲存變更</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script type="module" src="js/flex2html.js"></script>
  <script type="module" src="js/flex_builder.js"></script>
  <!-- script src="../js/flex_builder.js"></script -->

  <!-- 新增 Flex Message Modal -->
  <div class="modal fade" id="newFlexModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">創立新 Flex Message</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Flex 名稱</label>
          <input type="text" class="form-control" id="new-flex-name" placeholder="請輸入名稱" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary" id="create-flex-btn">建立</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JSON Import/Export Modal -->
  <div class="modal fade" id="json-io-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">匯入 / 匯出 Flex Message JSON</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">您可以在下方編輯 JSON，完成後按「確定更新」來刷新預覽。您也可以直接「複製」目前的 JSON 內容。</p>
          <textarea id="json-io-textarea" class="form-control" rows="15"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-outline-primary" id="copy-json-btn">複製</button>
          <button type="button" class="btn btn-primary" id="update-json-btn">確定更新</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 引入 Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>圖文訊息 編輯</title>
  <!-- 引入初始化腳本與動畫 -->
  <script src="js/init.js"></script>
  <script src="js/animation.js"></script>
</head>
<body>
  <!-- Navbar 區（可自行加入 LOGO 與導覽）
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">ImageMap 編輯</a>
      <div id="navbar-placeholder"></div>
    </div>
  </nav> -->

  <!-- 主要內容 -->
  <div class="container">
    <!-- 標題與說明 -->
    <div class="container mt-5 mb-4">
      <h2 class="mb-4">圖文訊息 編輯</h2>
      <p class="lead">新增、管理與設定您的圖文訊息</p>
    </div>

        
    <!-- 專案與狀態區 -->
    <div class="row mb-4">
      <div class="col-md-6">
        <label for="project-select" class="form-label">選擇專案:</label>
        <select id="project-select" class="form-select">
          <option value="">請選擇專案</option>
        </select>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <p id="status" class="w-100 text-center"></p>
      </div>
    </div>


    <!-- 內容區：左側縮圖列表 / 右側預覽與編輯 -->
    <div class="row">
      <!-- 左側：ImageMap 縮圖列表 -->
      <div class="col-md-3">
        <div class="card mb-3">
          <div class="card-header">
            <h6 class="card-title mb-0">已儲存的 ImageMap</h6>
          </div>
          <div class="card-body overflow-auto" id="imagemap-thumbnails" style="height:300px;">
            <!-- 縮圖由 JS 載入，lazy-loading 並顯示新建標記 -->
          </div>
          <div class="card-footer">
            <!-- 新增 ImageMap 按鈕：點擊時清空預覽區 -->
            <button id="create-new-imagemap" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#new-imagemap-modal">新增 ImageMap</button>
            <button id="upload-imagemap" class="btn btn-outline-success w-100 mt-2">上傳 ImageMap</button>
          </div>
        </div>
      </div>

      <!-- 右側：預覽與編輯區 -->
      <div class="col-md-9">
        <div class="card mb-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <input type="text" class="form-control w-75" id="menu-name" placeholder="圖文訊息名稱" required>
            <button id="save-edited-imagemap" class="btn btn-success ms-2">儲存</button>
            <button id="delete-selected-imagemap" class="btn btn-danger ms-2">刪除</button>
          </div>
          <div class="card-body">
            <div class="uploaded-image-container mb-3">
              <div id="mouse-coords" style="
              position: absolute;
              pointer-events: none;
              background: rgba(0,0,0,0.5);
              color: #fff;
              padding: 2px 4px;
              border-radius: 3px;
              font-size: 12px;
              display: none;
              z-index: 10;"></div>
              <canvas id="uploaded-image-canvas"></canvas>
            </div>
            
            <h5>選擇的區域</h5>
            <table class="table table-bordered" id="areas-table">
              <thead>
                <tr>
                  <th style="width:20px;">#</th>
                  <th style="width:30px;">X</th>
                  <th style="width:30px;">Y</th>
                  <th style="width:30px;">寬度</th>
                  <th style="width:30px;">高度</th>
                  <th style="width:80px;">格式</th>
                  <th style="width:300px;">內容</th>
                  <th style="width:50px;">操作</th>
                </tr>
              </thead>
              <tbody>
                <!-- 區域資料將由 JS 動態填入 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增 ImageMap Modal -->
  <div id="new-imagemap-modal" class="modal fade" tabindex="-1" aria-labelledby="newImagemapLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newImagemapLabel">新增圖文訊息</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <form id="new-imagemap-form">
            <div class="mb-3">
              <label for="new-menu-name" class="form-label">選單名稱 *</label>
              <input type="text" class="form-control" id="new-menu-name" placeholder="例如：啥活動啊" required>
            </div>
            <div class="mb-3">
              <label class="form-label">選擇圖片方式</label>
              <div class="d-flex gap-3">
                <input class="form-control d-none" type="file" id="new-image-upload" accept="image/png, image/jpeg">
                <button type="button" class="btn btn-outline-primary" id="trigger-image-upload">選擇檔案</button>
                <input class="form-control" type="text" id="new-image-url" placeholder="輸入圖片網址">
              </div>
              <div class="form-text">
                格式: JPEG/PNG, 尺寸: 1040x1040, 大小: 1MB 以下
              </div>
              <div class="mt-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="preview-image-url">預覽圖片</button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">圖片預覽</label>
              <div class="d-flex justify-content-center">
                <img id="image-preview" src="" alt="預覽圖片" class="img-fluid" style="max-height:200px; display:none;">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <!-- 當按下「預覽」時，將預覽圖片更新到右側 -->
          <!-- 當按下「儲存」時，除了儲存 ImageMap 外，會將預覽區清空並把新 ImageMap 加入縮圖區，並標記為新建 -->
          <button type="button" class="btn btn-success" id="confirm-new-imagemap">確定</button>
          <button type="button" class="btn btn-primary" id="reset-imagemap">重設</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 修改 Action Modal -->
  <div id="edit-modal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">修改選項</h5>
        </div>
        <div class="modal-body">
          <form>
            <!--
            <div class="mb-3">
              <label for="link-type" class="form-label">選擇類型：</label>
              <select class="form-select" id="action">
                <option value="message">文字</option>
                <option value="uri">連結</option>
              </select>
            </div>
            <div class="mb-3" id="link-container">
              <label id="input-info" for="link-input" class="form-label">輸入連結/文字：</label>
              <input type="text" class="form-control" id="data-input">
              <select class="form-select d-none" id="page-selector"></select> -->
<!--             

              <div class="mb-3">
                <label for="reply-type" class="form-label">回覆類型</label>
                <select id="reply-type" class="form-select"></select>
              </div>
     -->
              <!-- 根據回覆類型動態顯示輸入欄位 -->
              <div class="mb-3" id="reply-dynamic-fields">
                <!-- JS 動態插入：textarea、dropdown 或 file upload -->
              </div>
              <!-- <input id="data-input" />
              <div id="reply-input-area" class="mb-3"></div>
              <div id="selected-reply-display" class="mt-2 text-success"></div> -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="save-button">確認</button>
          <button type="button" class="btn btn-primary" id="update-button">修改</button>
          <button type="button" class="btn btn-danger" id="delete-button">刪除</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancel-button">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 上傳中動畫 Modal -->
  <div id="uploading-data-modal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">資料上傳中</h5>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">載入中...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 更新至 Line@ 確認 Modal -->
<div class="modal fade" id="confirm-update-modal" tabindex="-1" aria-labelledby="confirmUpdateModalLabel" aria-hidden="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-success">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="confirmUpdateModalLabel">確認更新至 Line@</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>你即將上傳目前所有 ImageMap 到 Line@，請選擇預設的選單：</p>

        <div class="mb-3">
          <label for="select-default-imagemap" class="form-label">預設 ImageMap</label>
          <select id="select-default-imagemap" class="form-select">
            <!-- JS 會自動填入 imagemap 選項 -->
          </select>
        <div id="loading-spinner" style="display:none;" class="text-center mt-3">
          <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">載入中...</span>
          </div>
        </div>
        </div>

        <p class="text-danger fw-bold mt-2">⚠️ 注意：此操作將會同步取代 Line@ 上的設定。</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-success" id="confirm-update-line">✅ 確定更新</button>
      </div>
    </div>
  </div>
</div>

  <!-- 傳送中進度 Modal -->
  <div class="modal fade" id="upload-progress-modal" tabindex="-1" aria-labelledby="uploadProgressModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-info">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title" id="uploadProgressModalLabel">正在同步至 Line@</h5>
        </div>
        <div class="modal-body">
          <ul id="upload-task-log" class="list-group small">
            <!-- JavaScript 會動態插入每個 ImageMap 傳送狀態 -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入 JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <!-- script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script -->
  <script src="js/imagemap_builder.js"></script>
  <!-- 如有 navbar.js 可加入 -->
  <!-- <script src="js/navbar.js"></script> -->
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 引入 Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>圖文訊息 編輯</title>
  <!-- 引入初始化腳本與動畫 -->
  <script src="../js/init.js"></script>
  <script src="../js/animation.js"></script>
</head>

<body>
  <!-- Navbar 區（可自行加入 LOGO 與導覽）
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">ImageMap 編輯</a>
      <div id="navbar-placeholder"></div>
    </div>
  </nav> -->

  <!-- 主要內容 -->
  <div class="container-fluid py-4">
    <!-- 標題列 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="mb-1"><i class="bi bi-image text-primary"></i> 圖文訊息管理</h4>
        <p class="text-muted mb-0">新增、管理與設定您的圖文訊息</p>
      </div>
      <div class="d-flex gap-2">
        <button id="create-new-imagemap" class="btn btn-primary" data-bs-toggle="modal"
          data-bs-target="#new-imagemap-modal">
          <i class="bi bi-plus-lg"></i> 新增 ImageMap
        </button>
        <button id="upload-imagemap" class="btn btn-outline-success">
          <i class="bi bi-cloud-upload"></i> 同步至 LINE
        </button>
      </div>
    </div>

    <!-- 內容區：左側縮圖列表 / 右側預覽與編輯 -->
    <div class="row">
      <!-- 左側：ImageMap 縮圖列表 -->
      <div class="col-md-3">
        <div class="card d-flex flex-column" style="height: 80vh;">
          <div class="card-header flex-shrink-0">
            <h6 class="card-title mb-0"><i class="bi bi-collection"></i> 已儲存的 ImageMap</h6>
          </div>
          <div class="card-body p-2" style="flex: none;">
            <!-- 搜尋區域 -->
            <div class="input-group input-group-sm">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="imagemap-search" class="form-control" placeholder="搜尋名稱...">
              <button class="btn btn-outline-secondary" type="button" id="clear-imagemap-search">清除</button>
            </div>
            <small class="text-muted" id="imagemap-search-result-count"></small>
          </div>
          <div class="card-body overflow-auto flex-grow-1" id="imagemap-thumbnails">
            <!-- 縮圖由 JS 載入 -->
          </div>
        </div>
      </div>


      <!-- 右側：預覽與編輯區 -->
      <div class="col-md-9">
        <div class="card mb-4">
          <div class="card-header d-flex justify-content-between align-items-center">
            <input type="text" class="form-control w-75" id="menu-name" placeholder="圖文訊息名稱" required>
            <button id="save-edited-imagemap" class="btn btn-success ms-2">儲存</button>
            <button id="delete-selected-imagemap" class="btn btn-danger ms-2">刪除</button>
          </div>
          <div class="card-body">
            <div class="uploaded-image-container mb-3">
              <div id="mouse-coords" style="
              position: absolute;
              pointer-events: none;
              background: rgba(0,0,0,0.5);
              color: #fff;
              padding: 2px 4px;
              border-radius: 3px;
              font-size: 12px;
              display: none;
              z-index: 10;"></div>
              <canvas id="uploaded-image-canvas"></canvas>
            </div>

            <h5>選擇的區域</h5>
            <table class="table table-bordered" id="areas-table">
              <thead>
                <tr>
                  <th class="text-center" style="width:60px;">#</th>
                  <th style="width:150px;">座標與尺寸</th>
                  <th style="width:130px;">類型</th>
                  <th style="min-width:250px;">內容</th>
                  <th class="text-center" style="width:120px;">操作</th>
                </tr>
              </thead>
              <tbody>
                <!-- 區域資料將由 JS 動態填入 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增 ImageMap Modal -->
  <div id="new-imagemap-modal" class="modal fade" tabindex="-1" aria-labelledby="newImagemapLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newImagemapLabel">新增圖文訊息</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body">
          <form id="new-imagemap-form">
            <div class="mb-3">
              <label for="new-menu-name" class="form-label">選單名稱 *</label>
              <input type="text" class="form-control" id="new-menu-name" placeholder="例如：啥活動啊" required>
            </div>
            <div class="mb-3">
              <label class="form-label">上傳圖片 *</label>
              <div>
                <input class="form-control d-none" type="file" id="new-image-upload" accept="image/png, image/jpeg">
                <button type="button" class="btn btn-outline-primary w-100" id="trigger-image-upload">📁 選擇圖片檔案</button>
              </div>
              <div class="form-text mt-2">
                📐 格式: JPEG/PNG, 尺寸: 1040x1040, 大小: 1MB 以下
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">圖片預覽</label>
              <div class="d-flex justify-content-center">
                <img id="image-preview" src="" alt="預覽圖片" class="img-fluid" style="max-height:200px; display:none;">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <!-- 當按下「預覽」時，將預覽圖片更新到右側 -->
          <!-- 當按下「儲存」時，除了儲存 ImageMap 外，會將預覽區清空並把新 ImageMap 加入縮圖區，並標記為新建 -->
          <button type="button" class="btn btn-success" id="confirm-new-imagemap">確定</button>
          <button type="button" class="btn btn-primary" id="reset-imagemap">重設</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 修改 Action Modal -->
  <div id="edit-modal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">修改選項</h5>
        </div>
        <div class="modal-body">
          <form>
            <!-- 動態內容由 generateReplyInputUI 產生 -->
            <div class="mb-3" id="reply-dynamic-fields">
              <!-- JS 動態插入：根據 helper 產生的 UI -->
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="save-button">確認</button>
          <button type="button" class="btn btn-primary" id="update-button">修改</button>
          <button type="button" class="btn btn-danger" id="delete-button">刪除</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancel-button">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 上傳中動畫 Modal -->
  <div id="uploading-data-modal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">資料上傳中</h5>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">載入中...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 更新至 Line@ 確認 Modal -->
  <div class="modal fade" id="confirm-update-modal" tabindex="-1" aria-labelledby="confirmUpdateModalLabel"
    aria-hidden="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-success">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="confirmUpdateModalLabel">確認更新至 Line@</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>你即將上傳目前所有 ImageMap 到 Line@，請選擇預設的選單：</p>

          <div class="mb-3">
            <label for="select-default-imagemap" class="form-label">預設 ImageMap</label>
            <select id="select-default-imagemap" class="form-select">
              <!-- JS 會自動填入 imagemap 選項 -->
            </select>
            <div id="loading-spinner" style="display:none;" class="text-center mt-3">
              <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">載入中...</span>
              </div>
            </div>
          </div>

          <p class="text-danger fw-bold mt-2">⚠️ 注意：此操作將會同步取代 Line@ 上的設定。</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-success" id="confirm-update-line">✅ 確定更新</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 傳送中進度 Modal -->
  <div class="modal fade" id="upload-progress-modal" tabindex="-1" aria-labelledby="uploadProgressModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-info">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title" id="uploadProgressModalLabel">正在同步至 Line@</h5>
        </div>
        <div class="modal-body">
          <ul id="upload-task-log" class="list-group small">
            <!-- JavaScript 會動態插入每個 ImageMap 傳送狀態 -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入 JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <!-- script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script -->
  <script src="../js/imagemap_builder.js" type="module"></script>
  <!-- 如有 navbar.js 可加入 -->
  <!-- <script src="js/navbar.js"></script> -->
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>視覺化流程編輯器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Drawflow CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow@0.0.59/dist/drawflow.min.css">
  <style>
    #drawflow {
      width: 100%;
      height: 80vh;
      border: 1px solid #ced4da;
      background: #f8f9fa;
      background-image:
        linear-gradient(to right, #e9ecef 1px, transparent 1px),
        linear-gradient(to bottom, #e9ecef 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body>
  <div class="container-fluid p-4">
    <h2 class="mb-4">視覺化流程編輯器</h2>
    <div id="drawflow"></div>
  </div>

  <!-- Drawflow JS will be loaded dynamically by flow_editor.js -->
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadingManager 測試</title>
    <link rel="stylesheet" href="../css/loader.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 50px;
        }

        .test-btn {
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>LoadingManager 測試頁面</h1>

        <div class="alert alert-info">
            <h5>測試步驟：</h5>
            <ol>
                <li>點擊「測試 LoadingManager」應該看到暗色毛玻璃 loading</li>
                <li>點擊「測試舊的 showLoader」應該看到白色背景 loading</li>
                <li>點擊「測試多重 loading」應該看到最後一個</li>
            </ol>
        </div>

        <button class="btn btn-primary test-btn" onclick="testLoadingManager()">
            測試 LoadingManager
        </button>

        <button class="btn btn-secondary test-btn" onclick="testShowLoader()">
            測試舊的 showLoader
        </button>

        <button class="btn btn-success test-btn" onclick="testMultiple()">
            測試多重 loading
        </button>

        <div class="mt-4">
            <h5>預期效果：</h5>
            <ul>
                <li><strong>LoadingManager</strong>: 黑色半透明背景 + 毛玻璃 + 白色 spinner + 白色文字</li>
                <li><strong>showLoader</strong>: 白色背景 + 藍色 spinner + 黑色文字</li>
            </ul>
        </div>

        <div class="mt-4 p-3 border">
            <h5>Console 輸出：</h5>
            <pre id="console-output"
                style="background: #f5f5f5; padding: 10px; max-height: 300px; overflow-y: auto;"></pre>
        </div>
    </div>

    <script type="module">
        import { LoadingManager, showLoader, hideLoader } from '../js/shared/loader.js';

        // 測試函數
        window.testLoadingManager = function () {
            log('✅ 測試 LoadingManager.show()');
            LoadingManager.show('test', '測試 LoadingManager...');

            setTimeout(() => {
                log('✅ LoadingManager.update()');
                LoadingManager.update('test', '更新訊息...');
            }, 1500);

            setTimeout(() => {
                log('✅ LoadingManager.hide()');
                LoadingManager.hide('test');
            }, 3000);
        };

        window.testShowLoader = function () {
            log('✅ 測試 showLoader()');
            showLoader('測試舊的 showLoader...');

            setTimeout(() => {
                log('✅ hideLoader()');
                hideLoader();
            }, 3000);
        };

        window.testMultiple = function () {
            log('✅ 測試多重 loading');
            LoadingManager.show('test1', 'Loading 1...');

            setTimeout(() => {
                log('✅ 顯示 Loading 2');
                LoadingManager.show('test2', 'Loading 2...');
            }, 1000);

            setTimeout(() => {
                log('✅ 隱藏 Loading 2');
                LoadingManager.hide('test2');
            }, 2500);

            setTimeout(() => {
                log('✅ 隱藏 Loading 1');
                LoadingManager.hide('test1');
            }, 3500);
        };

        function log(msg) {
            const output = document.getElementById('console-output');
            const time = new Date().toLocaleTimeString();
            output.textContent += `[${time}] ${msg}\n`;
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }

        // 頁面載入時記錄
        log('📄 頁面已載入');
        log('📦 LoadingManager 已引入');
    </script>
</body>

</html>

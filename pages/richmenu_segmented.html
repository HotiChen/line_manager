<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分眾圖文選單 - LINE SaaS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .header-section p {
            color: #666;
            margin-top: 10px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .rule-form {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr auto;
            gap: 20px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #444;
        }

        select,
        input {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus,
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .rule-list {
            margin-top: 30px;
        }

        .rule-item {
            display: grid;
            grid-template-columns: 80px 1.5fr 1.5fr auto;
            gap: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            margin-bottom: 12px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .rule-item:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.01);
        }

        .rule-priority {
            font-size: 1.2rem;
            font-weight: 700;
            color: #764ba2;
            text-align: center;
        }

        .rule-info {
            display: flex;
            flex-direction: column;
        }

        .rule-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
        }

        .rule-value {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .tag-badge {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .delete-btn {
            color: #ff4757;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: rgba(255, 71, 87, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: #888;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* 預覽選單 */
        .richmenu-preview {
            width: 100px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #eee;
            border: 1px solid #ddd;
        }

        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-section">
            <div>
                <h1>分眾圖文選單</h1>
                <p>根據使用者標籤自動切換適合的選單，提升轉化率與互動感。</p>
            </div>
            <button class="btn btn-outline" id="syncAllBtn">
                <i class="fas fa-sync"></i> 同步所有用戶
            </button>
        </div>

        <div class="card">
            <div class="rule-form">
                <div class="form-group">
                    <label>會員標籤</label>
                    <select id="tagSelect">
                        <option value="">載入中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>對應圖文選單</label>
                    <select id="richmenuSelect">
                        <option value="">載入中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>優先級 (1最高)</label>
                    <input type="number" id="priorityInput" value="1" min="1">
                </div>
                <button class="btn btn-primary" id="addRuleBtn">
                    <i class="fas fa-plus"></i> 新增規則
                </button>
            </div>
        </div>

        <div class="card">
            <div class="rule-list" id="ruleList">
                <div class="empty-state">
                    <i class="fas fa-layer-group"></i>
                    <p>尚未建立分眾規則，點擊上方按鈕開始新增。</p>
                </div>
            </div>

            <div class="actions-bar">
                <button class="btn btn-primary" id="saveRulesBtn">
                    <i class="fas fa-save"></i> 儲存所有規則
                </button>
            </div>
        </div>
    </div>

    <!-- 成功提示 Toast -->
    <div id="toast"
        style="display:none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000;">
        <span id="toastMsg">成功</span>
    </div>

    <script src="../js/api.client.js"></script>
    <script src="../js/richmenu_segmented.js"></script>
</body>

</html>

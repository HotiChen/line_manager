<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="module" src="./js/main.js?v=0.003"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Local CSS -->
  <link rel="stylesheet" href="css/richmenu_css.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/flex-reusable.css">

  <link rel="stylesheet" href="css/flow_theme.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- UI Enhancements -->
  <link rel="stylesheet" href="css/ui-enhancements.css">

  <link rel="icon" href="data:,">
  <style>
    body {
      padding-top: 0;
      margin: 0;
    }

    /* ── Dark Sidebar ── */
    .sidebar-container {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      z-index: 1020;
      overflow-y: auto;
      background-color: #0f172a;
      border-right: none;
      display: flex;
      flex-direction: column;
    }

    /* Brand logo strip */
    .sidebar-brand {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .sidebar-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06c755 0%, #00a642 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .sidebar-brand-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #f1f5f9;
      letter-spacing: 0.02em;
    }

    .sidebar-brand-name span {
      color: #06c755;
    }

    /* User header */
    .sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: transparent;
    }

    .sidebar-selectors {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .sidebar-menu {
      flex: 1;
      padding: 10px 10px;
      overflow-y: auto;
    }

    .main-content-area {
      margin-left: 240px;
      min-height: 100vh;
      background-color: #f1f5f9;
    }

    /* Nav links */
    .sidebar-nav .nav-link {
      color: #94a3b8;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.85rem;
      transition: background 0.15s, color 0.15s;
    }

    .sidebar-nav .nav-link:hover {
      color: #f1f5f9;
      background: rgba(255,255,255,0.08);
    }

    .sidebar-nav .nav-link.active {
      color: #ffffff;
      background: rgba(6,199,85,0.18);
    }

    /* Section dividers */
    .sidebar-nav .text-muted.fw-semibold {
      color: #475569 !important;
      font-size: 0.68rem;
      letter-spacing: 0.07em;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.07) !important;
    }

    /* Selectors */
    .selector-group {
      margin-bottom: 8px;
    }

    .selector-group:last-child {
      margin-bottom: 0;
    }

    .selector-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }

    .selector-group .form-select {
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
      background-color: #1e293b;
      border-color: rgba(255,255,255,0.1);
      color: #cbd5e1;
    }

    .selector-group .form-select:focus {
      background-color: #1e293b;
      border-color: #06c755;
      color: #f1f5f9;
      box-shadow: 0 0 0 2px rgba(6,199,85,0.2);
    }

    .selector-group .form-select option {
      background-color: #1e293b;
      color: #cbd5e1;
    }

    /* User section */
    .user-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    .btn-logout {
      padding: 3px 8px;
      font-size: 0.72rem;
      border-radius: 4px;
      color: #64748b;
      border-color: #334155;
    }

    .btn-logout:hover {
      color: #f1f5f9;
      background-color: #334155;
      border-color: #334155;
    }

    /* Scrollbar for dark sidebar */
    .sidebar-container::-webkit-scrollbar { width: 4px; }
    .sidebar-container::-webkit-scrollbar-track { background: transparent; }
    .sidebar-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>

<body>
  <!-- Toast Container for Notifications -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- New Sidebar -->
  <nav class="sidebar-container">
    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon"><i class="bi bi-diagram-3"></i></div>
      <div class="sidebar-brand-name"><span>LINE</span> 管理後台</div>
    </div>

    <!-- User Section -->
    <div class="sidebar-header">
      <div class="user-section">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">U</div>
          <span class="user-name" id="sidebar-user-name">載入中...</span>
        </div>
        <button id="btn-logout" class="btn btn-outline-secondary btn-logout">登出</button>
      </div>
    </div>

    <!-- Selectors Section -->
    <div class="sidebar-selectors">
      <!-- LINE@ (Bot) Selector -->
      <div class="selector-group">
        <div class="selector-label">LINE@ 帳號</div>
        <select id="bot-select-global" class="form-select">
          <option value="">選擇帳號...</option>
        </select>
      </div>

      <!-- Project Selector (Placeholder for future) -->
      <div class="selector-group">
        <div class="selector-label">專案</div>
        <select id="project-select-sidebar" class="form-select">
          <option value="">全部資源</option>
        </select>
      </div>
    </div>

    <!-- Menu Section -->
    <div class="sidebar-menu">
      <ul class="nav flex-column sidebar-nav">

        <!-- 主控台 -->
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="dashboard">
            <i class="bi bi-speedometer2 me-2"></i>主控台
          </a>
        </li>

        <!-- 系統設定 -->
        <li class="nav-item mb-1">
          <div class="text-muted border-top pt-2 fw-semibold small">系統設定</div>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="profile">
            <i class="bi bi-person-gear me-2"></i>個人設定
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="team_management">
            <i class="bi bi-people me-2"></i>團隊管理
          </a>
        </li>

        <!-- 流程設計 -->
        <li class="nav-item mb-1">
          <div class="text-muted border-top pt-2 fw-semibold small">流程設計</div>
        </li>
        <li class="nav-item">
          <a href="./pages/flow_designer_full.html" target="_blank" class="nav-link"
            onclick="(function(e){ const uid = localStorage.getItem('linebot_userId'); if(uid){ e.preventDefault(); window.open('./pages/flow_designer_full.html?userId=' + encodeURIComponent(uid), '_blank'); } })(event)">
            <i class="bi bi-diagram-3 me-2"></i>視覺化流程設計
            <i class="bi bi-box-arrow-up-right ms-1 text-muted" style="font-size: 0.8em;"></i>
          </a>
        </li>

        <!-- 互動功能 -->
        <li class="nav-item mb-1">
          <div class="text-muted border-top pt-2 fw-semibold small">互動功能</div>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="richmenu">
            <i class="bi bi-menu-button-wide me-2"></i>Richmenu 管理
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="richmenu_segmented">
            <i class="bi bi-layers me-2 text-info"></i>分眾圖文選單
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="keyword_reply_builder">
            <i class="bi bi-chat-dots me-2"></i>關鍵字自動回覆
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="welcome_msg_builder">
            <i class="bi bi-chat-heart me-2"></i>歡迎訊息
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="quick_reply_builder">
            <i class="bi bi-lightning-charge me-2 text-warning"></i>Quick Reply
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="message_push">
            <i class="bi bi-send me-2 text-primary"></i>訊息發送
          </a>
        </li>

        <!-- 訊息內容 -->
        <li class="nav-item mb-1">
          <div class="text-muted border-top pt-2 fw-semibold small">訊息內容</div>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="flex_builder">
            <i class="bi bi-phone me-2"></i>Flex Message 管理
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="imagemap_builder">
            <i class="bi bi-image me-2"></i>圖文訊息 管理
          </a>
        </li>

        <!-- 客戶管理 -->
        <li class="nav-item mb-1">
          <div class="text-muted border-top pt-2 fw-semibold small">客戶管理</div>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="member_builder">
            <i class="bi bi-person-vcard me-2"></i>會員管理
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="tier_settings">
            <i class="bi bi-crown me-2 text-warning"></i>會員等級設定
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" data-page="tag">
            <i class="bi bi-tags me-2"></i>標籤管理
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content-area" id="main">
    <!-- LoadingManager 會在 JavaScript 執行後立即顯示 -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Load LIFF SDK only in production; provide a no-op stub on localhost
    if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      document.write('<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"><\/script>');
    } else {
      window.liff = {
        init: () => Promise.resolve(),
        isLoggedIn: () => false,
        getAccessToken: () => null,
        getProfile: () => Promise.resolve(null),
        logout: () => {},
        isInClient: () => false,
        login: () => {}
      };
    }
  </script>


  <script src="./js/animation.js" defer></script>
  <script type="module" src="./js/flex2html.js"></script>
</body>

</html>

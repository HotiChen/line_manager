  <style>
    /* New Layout: No top bar, wider sidebar */
    body {
      padding-top: 0;
      margin: 0;
    }

    .sidebar-container {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      z-index: 1020;
      overflow-y: auto;
      background-color: #f8f9fa;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
    }

    .sidebar-selectors {
      padding: 8px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-menu {
      flex: 1;
      padding: 10px 12px;
      overflow-y: auto;
    }

    .main-content-area {
      margin-left: 240px;
      min-height: 100vh;
      background-color: #f8f9fa;
    }

    /* Selector styles */
    .selector-group {
      margin-bottom: 8px;
    }

    .selector-group:last-child {
      margin-bottom: 0;
    }

    .selector-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .selector-group .form-select {
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* User section */
    .user-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #1f2937;
    }

    .btn-logout {
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
    }
  </style>

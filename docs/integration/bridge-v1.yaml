# ───────────────────────── 契約測試（LM-1D）─────────────────────────
# 這份檔案是「被檢查的契約」：tests/unit/test_bridge_contract_spec.mjs（規格自洽、與程式常數一致）與
# tests/unit/test_bridge_contract_conformance.mjs（對真實 Worker 發請求，狀態碼／本文／標頭都要符合本檔）
# 會在 `npm test` 裡比對。改 Bridge 端點或回應時，請同步改本檔；改了本檔也要讓程式跟上，兩邊任一邊漂移測試都會紅。
# 新增或修改端點的步驟與規則見 docs/integration/gap-analysis.md 的「契約測試」一節。
openapi: 3.0.3
info:
  title: LM Bridge API
  version: 1.0.0-draft
  description: |
    LM 側的 Bridge 契約（草稿，G0 確認後凍結）。

    範圍：另一個產品（呼叫端，下稱「產品」）如何連結到 LM 管理的 LINE 官方帳號（OA），
    並透過 LM 對已綁定的聯絡人發送通知。只描述 LM 這一側的介面，不含呼叫端內部設計。

    設計決定（見 gap-analysis.md）：
    - 前綴 `/bridge/v1`，Bridge 自己的資料放 D1，不放 LM 的 KV。
    - 兩層訊息：`/messages` 為受限格式，連結流程發出的金鑰只能用這層；
      `/raw/*` 為原樣轉送 LINE 訊息，只給 owner 在後台手動發放的信任金鑰。
    - 收件人以 `external_contact_ref` 表示，呼叫端永遠拿不到 LINE userId。
    - 聯絡人綁定用「綁定碼訊息」：客戶把綁定碼傳給 OA，由 webhook 取得該 OA 所屬 Provider 的 userId，
      不依賴 LINE Login。

    實作狀態以 `x-status` 標示：`implemented`（程式已完成於 `/bridge/v1`；LM-2A 的端點待部署並手動套用遷移 0002、LM-3A 的端點待手動套用遷移 0003）、`partial`、`planned`。

    LM-1A 已完成：`/raw/push`、`/raw/multicast` 由原本的 `/api/v1/messages/push|multicast` 搬到
    `/bridge/v1/raw/*`（舊路徑已移除），Bridge 在 `BRIDGE_ENABLED=1` 時才啟用，關閉時整個 `/bridge/*` 回 404。

    LM-3A-1 後端已完成（程式；待部署與手動遷移 0003，見 lm-3a-plan.md 第 13 節）：`contacts/bind-tokens`（POST）、`contacts/{external_contact_ref}`（GET／DELETE）。
    綁定碼訊息只在 1 對 1 聊天室生效（群組碼路徑尚未實作）；`bind_url` 的預填連結形式尚待真實 OA 驗證（3A-2）。

    LM-2A 後端已完成（程式；待部署與手動遷移，見 lm-2a-plan.md 第 14 節）：`link/authorize`、`links/token`、`links/{link_id}`（GET／DELETE）、`links/{link_id}/rotate-key`。
    這些新端點的錯誤一律用下方 `Error` 格式、欄位 snake_case。
    所有端點另外可能回 `503`（資料庫未設定，`INTERNAL`／`bridge_not_configured`）與 `500`（未預期錯誤，`INTERNAL`，`retryable: true`）；
    `/health` 與 `/raw/*` 的 503／500 是舊格式（`LegacyError`）。含金鑰或授權碼的成功回應都帶 `Cache-Control: no-store`。
    不在本契約的 LM-2A 管理端點（營運與後台用，不屬於產品呼叫端）：`POST /bridge/v1/admin/products`（營運密鑰登記產品）、
    `GET /bridge/v1/link/authorize/preview`、`POST /bridge/v1/link/authorize/approve`（同意頁，LIFF）、
    `GET /bridge/v1/admin/links`、`DELETE /bridge/v1/admin/links/{link_id}`（後台，LIFF＋owner）。

    另有一組「人主體」的管理端點 `/bridge/v1/systems*`（註冊／列出／停用／輪替／刪除 service key，
    LIFF 認證 + owner 權限，供 LM 後台使用）。它是 LM 後台的 admin API，不屬於呼叫端契約，因此不列在本檔。
  x-status-legend:
    implemented: 目前已上線（需 BRIDGE_ENABLED=1）
    partial: 部分已有
    planned: 尚未實作
servers:
  - url: https://imhoti.tw/lm
    description: 正式環境（Worker 掛載於 /lm）

tags:
  - name: system
  - name: link
  - name: contacts
  - name: messages
  - name: raw

security:
  - linkKey: []

paths:
  /bridge/v1/health:
    get:
      tags: [system]
      summary: 健康檢查
      security: []
      x-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '503':
          description: BRIDGE_DB 未綁定或查詢失敗（舊格式 `{success:false,error:"bridge_not_configured"}`）
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }

  /bridge/v1/link/authorize:
    get:
      tags: [link]
      summary: 同意頁（瀏覽器，需 LM 登入）
      description: |
        產品把使用者導向這裡。LM 確認此人對該 OA 具備 owner 權限、讓他選擇 Bot、顯示授權範圍並請他同意，
        然後產生一次性授權碼（5 分鐘、單次使用）導回 `redirect_uri`。
        `redirect_uri` 必須與產品註冊的值精確比對。
      security: []
      x-status: implemented
      parameters:
        - { name: product_id, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 256 } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        '302':
          description: |
            參數通過驗證後導向 LM 的同意頁（`/pages/link_authorize.html`）；使用者同意後由該頁導回 `redirect_uri`，帶 `code` 與原樣的 `state`（取消則帶 `error=access_denied` 與 `state`）。
          headers:
            Location: { required: true, schema: { type: string, format: uri }, description: 同意頁網址 }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400':
          description: product_id、state 或 redirect_uri 不合（INVALID_REQUEST）。不會導向任何未驗證的位址。
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /bridge/v1/links/token:
    post:
      tags: [link]
      summary: 授權碼換連結與金鑰
      description: 金鑰只在這次回應出現。授權碼只能用一次；已使用或過期回 `INVALID_CODE`。
      security:
        - productSecret: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: { type: string }
                redirect_uri: { type: string, format: uri }
      responses:
        '200':
          description: 連結建立
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [link_id, service_key, scopes, bot_display_name]
                properties:
                  link_id: { type: string, example: lnk_abc123 }
                  service_key:
                    type: string
                    description: 只出現這一次
                    example: brk_ab12cd_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                  scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
                  bot_display_name: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /bridge/v1/links/{link_id}:
    parameters:
      - { name: link_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [link]
      summary: 連結狀態
      x-status: implemented
      x-scope: link:manage
      responses:
        '200':
          description: 連結資訊（不含任何金鑰）
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [link]
      summary: 解除連結
      description: 立即生效，舊金鑰此後回 `LINK_REVOKED`。兩邊的產品資料都不刪除。
      x-status: implemented
      x-scope: link:manage
      responses:
        '204':
          description: 已解除
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /bridge/v1/links/{link_id}/rotate-key:
    post:
      tags: [link]
      summary: 更換金鑰
      description: 新金鑰取代舊金鑰（舊的立即失效）。只能換自己這條連結的金鑰，不能產生其他連結或系統。
      x-status: implemented
      x-scope: link:manage
      parameters:
        - { name: link_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 新金鑰（只出現這一次）
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [service_key]
                properties:
                  service_key: { type: string }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /bridge/v1/contacts/bind-tokens:
    post:
      tags: [contacts]
      summary: 產生聯絡人綁定碼
      description: |
        呼叫端提供自己的不透明代號 `external_contact_ref`（不得含姓名、電話、Email）。
        LM 回傳一組綁定碼與給客戶看的連結：客戶開啟後會帶著預填好的訊息進入與 OA 的聊天室，
        傳出後由 webhook 取得 userId 並完成綁定。綁定碼 7 天有效、單次使用。

        不吃 `Idempotency-Key`（碼只存雜湊，無法重送同一組）：同一條連結對同一個 `external_contact_ref` 再要一次，
        舊的未用碼立即作廢，只回傳並保留最新一組。每條連結同時有效的未用碼上限 1000，超過回 `RATE_LIMITED`；
        另有每連結每分鐘 30 次的限流。
      x-status: implemented
      x-scope: contacts:bind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_contact_ref]
              properties:
                external_contact_ref: { $ref: '#/components/schemas/ContactRef' }
      responses:
        '201':
          description: 綁定碼已產生
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [bind_code, bind_url, expires_at]
                properties:
                  bind_code: { type: string, example: LM-B7K2QX9M, description: '`LM-` + 8 碼 Crockford base32；只在建立當下回傳一次' }
                  bind_url:
                    type: string
                    format: uri
                    nullable: true
                    description: |
                      給客戶的連結或 QR code 內容（LINE 的 OA 訊息連結 `https://line.me/R/oaMessage/@basic_id/?<bind_code>`，帶預填的綁定碼）。
                      取不到該 OA 的 basic ID 時為 `null`：改成顯示 `bind_code`，請客戶自己傳給 OA。
                  expires_at: { type: string, format: date-time }
        '400': { description: external_contact_ref 格式不符（INVALID_REQUEST）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: 超過每連結限流或未用碼上限（RATE_LIMITED）。每連結限流會帶 `Retry-After`；未用碼上限不帶（不是等一下就會好）。
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /bridge/v1/contacts/{external_contact_ref}:
    get:
      tags: [contacts]
      summary: 綁定狀態
      description: |
        只回狀態，不回 LINE userId、顯示名稱或頭像。只查「這條連結」自己的綁定；別條連結的 ref 看起來就是 `unbound`。
        `disabled` 只在連結已撤銷或產品停用的瞬間才可能出現（此時金鑰本身通常已先被擋下為 `LINK_REVOKED`）。
      x-status: implemented
      x-scope: contacts:bind
      parameters:
        - { name: external_contact_ref, in: path, required: true, schema: { $ref: '#/components/schemas/ContactRef' } }
      responses:
        '200':
          description: 綁定狀態
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: object
                required: [external_contact_ref, status]
                properties:
                  external_contact_ref: { $ref: '#/components/schemas/ContactRef' }
                  status:
                    type: string
                    enum: [unbound, pending, bound, blocked, disabled]
                  bound_at: { type: string, format: date-time, nullable: true, description: "只有 bound／blocked 才有值，其餘為 null" }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [contacts]
      summary: 解除綁定
      description: |
        刪除這條連結下該 `external_contact_ref` 的綁定，並作廢它所有的綁定碼（給「客戶要求刪除」用）。
        冪等：不論原本有沒有綁定或待用碼都回 204（不洩漏該代號是否存在過）。
      x-status: implemented
      x-scope: contacts:bind
      parameters:
        - { name: external_contact_ref, in: path, required: true, schema: { $ref: '#/components/schemas/ContactRef' } }
      responses:
        '204':
          description: 已解除（或本來就沒有）
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /bridge/v1/messages:
    post:
      tags: [messages]
      summary: 發送通知（受限格式）
      description: |
        已上線（LM-3B；需 `BRIDGE_ENABLED=1`）。只允許純文字的 `title`、`body` 與一個按鈕。
        訊息由 LM 組成固定外觀的 Flex bubble（標題粗體、內文、按鈕）；呼叫端不能帶 LINE message object。
        不接受圖片上傳。只能發給這條連結自己綁定的聯絡人；別條連結的 `external_contact_ref` 看起來就是 `CONTACT_NOT_BOUND`。
        `action.url`：https、無帳號密碼、埠為空或 443、非 IP、非 localhost、長度 ≤ 1000、無空白與控制字元，
        且主機名稱（小寫、去尾端點）等於該產品登記的某個網域，或是其子網域；不符回 `INVALID_URL_DOMAIN`。
        `title`、`body`、`action.label` 不可含 `http://` 或 `https://`（不分大小寫）→ `INVALID_REQUEST`；連結只能放在按鈕。
        `title`、`action.label` 不可含任何控制字元；`body` 只允許換行（`\n`）。長度以 Unicode code point 計。
        同步送出：200 即表示 LINE 已受理（`status: sent`），沒有 202／`accepted`，也沒有查詢端點與送達回報。
        同一連結內同一把 `Idempotency-Key` 重送，回傳第一次的結果並帶 `X-Idempotency-Replayed: true`，不會再發一次。
        只快取成功與確定性失敗；`CONTACT_NOT_BOUND`、`RECIPIENT_BLOCKED`、`QUOTA_EXCEEDED`、`RATE_LIMITED`、`INTERNAL`
        都不快取（客戶之後可能完成綁定或解除封鎖，同一把鍵重試會重新判斷）。這與 `/raw/*` 不同。
        限流：每連結每分鐘 60 則；每（連結, 聯絡人）每小時 10 則；超過回 `RATE_LIMITED` 並帶 `Retry-After`。
        每則訊息消耗 LINE 額度 1；額度用盡回 `QUOTA_EXCEEDED`。
        LINE 回 403（客戶封鎖）→ `RECIPIENT_BLOCKED`，並把該客戶的聯絡人標成 blocked（解除封鎖後由 follow 事件還原）。
        LINE 逾時／5xx／網路錯誤 → 502 `INTERNAL`（`retryable: true`）；bot 沒有可用的 token → 503 `INTERNAL`。
      x-status: implemented
      x-scope: messages:send
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Notification' }
      responses:
        '200':
          description: "已送出（LINE 已受理）"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Idempotency-Replayed:
              schema: { type: string, enum: ['true'] }
              description: "這是先前結果的重送"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "CONTACT_NOT_BOUND（沒有綁定）、RECIPIENT_BLOCKED（客戶封鎖了官方帳號）或 IN_PROGRESS（同一把鍵仍在處理中，可稍後重試）"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: "INVALID_REQUEST，本文過大（> 20000 字元）"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: "INVALID_URL_DOMAIN（`action.url` 不在白名單）或 IDEMPOTENCY_KEY_REUSE（同一把鍵配不同內容）"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: "RATE_LIMITED（每連結或每聯絡人頻率，或 LINE 端限流），依 `Retry-After` 重試"
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: "INTERNAL，`retryable: true`（LINE 無法連線或 5xx）"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: "INTERNAL（`bridge_not_configured` 或 `bot_not_configured`）"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /bridge/v1/messages/{message_id}:
    get:
      tags: [messages]
      summary: 發送結果
      description: LM-3B 決定不做（沒有查詢端點與送達回報；產品只能靠 `POST /messages` 的回應）。保留此條目，需要時再加。
      x-status: planned
      x-scope: messages:send
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 發送結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResult' }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bridge/v1/raw/push:
    post:
      tags: [raw]
      summary: 原樣轉送 LINE 訊息給單一對象（信任金鑰專用）
      description: |
        已上線於 `POST /bridge/v1/raw/push`（原 `/api/v1/messages/push`，LM-1A 已搬，舊路徑已移除；
        需 `BRIDGE_ENABLED=1`）。行為見該實作：scope、per-system 限流、
        `X-Idempotency-Key`、額度對帳（回報 `remaining`）、封鎖回 409。
        只有 owner 在後台手動發放、且 scope 含 `raw:push` 的金鑰可用；連結流程發出的金鑰永遠不含此 scope。
        scope 名稱已由 `messages:push` 改為 `raw:push`（LM-1C）；過渡期相容：註冊時舊名會正規化為 `raw:push`，舊金鑰裡的 `messages:push` 檢查時等同 `raw:push`。
        此端點目前仍回舊格式 `{success:false,error:"<snake_case>"}`（D-7；`LegacyError`，不是 `Error`），新錯誤格式見 `worker_src/bridge/errors.js`，由後續新端點採用。
        認證用 `Authorization: Bearer <金鑰>` 加 `X-Bot-Id`（必須等於金鑰所屬的 bot）。
        `X-Idempotency-Key`（選填，≤ 128 字元）：同鍵重送回傳第一次的結果並帶 `X-Idempotency-Replayed: true`；
        沒帶時回應多一個 `X-Idempotency-Missing: true`。只快取成功與確定性失敗（封鎖 409），額度用盡、找不到對象、LINE 端暫時性失敗都不快取。
        限流為每 system 每分鐘（預設 60，可由 owner 調整）。
      x-status: implemented
      x-scope: raw:push
      parameters:
        - $ref: '#/components/parameters/BotId'
        - $ref: '#/components/parameters/LegacyIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, messages]
              properties:
                to: { type: string, description: LINE user / group / room id }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: object, required: [type], additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/RawSent' }
        '400': { $ref: '#/components/responses/LegacyBadRequest' }
        '401': { $ref: '#/components/responses/LegacyUnauthorized' }
        '402': { $ref: '#/components/responses/LegacyQuotaExhausted' }
        '403': { $ref: '#/components/responses/LegacyForbidden' }
        '404': { $ref: '#/components/responses/LegacyTargetNotFound' }
        '409': { $ref: '#/components/responses/LegacyConflict' }
        '413': { $ref: '#/components/responses/LegacyTooLarge' }
        '422': { $ref: '#/components/responses/LegacyKeyReuse' }
        '429': { $ref: '#/components/responses/LegacyRateLimited' }
        '502': { $ref: '#/components/responses/LegacyBadGateway' }
        '503': { $ref: '#/components/responses/LegacyUnavailable' }

  /bridge/v1/raw/multicast:
    post:
      tags: [raw]
      summary: 原樣轉送 LINE 訊息給多人，上限 500（信任金鑰專用）
      description: |
        已上線於 `POST /bridge/v1/raw/multicast`（原 `/api/v1/messages/multicast`，LM-1A 已搬）。需 `BRIDGE_ENABLED=1`。
        認證、冪等、限流與錯誤格式（舊格式 `LegacyError`）同 `/raw/push`；`to` 重複的對象會去重，額度成本 = 去重後人數 × 則數。
        與 `/raw/push` 的差別：沒有 404 `target_not_found`；LINE 403 不轉成 409（歸為 502）。
      x-status: implemented
      x-scope: raw:push
      parameters:
        - $ref: '#/components/parameters/BotId'
        - $ref: '#/components/parameters/LegacyIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, messages]
              properties:
                to: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: object, required: [type], additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/RawSent' }
        '400': { $ref: '#/components/responses/LegacyBadRequest' }
        '401': { $ref: '#/components/responses/LegacyUnauthorized' }
        '402': { $ref: '#/components/responses/LegacyQuotaExhausted' }
        '403': { $ref: '#/components/responses/LegacyForbidden' }
        '409': { $ref: '#/components/responses/LegacyConflict' }
        '413': { $ref: '#/components/responses/LegacyTooLarge' }
        '422': { $ref: '#/components/responses/LegacyKeyReuse' }
        '429': { $ref: '#/components/responses/LegacyRateLimited' }
        '502': { $ref: '#/components/responses/LegacyBadGateway' }
        '503': { $ref: '#/components/responses/LegacyUnavailable' }

components:
  securitySchemes:
    linkKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer brk_<前綴>_<密鑰>`。資料庫只存整把金鑰的 SHA-256 雜湊；前綴（6 位小寫 hex）只是金鑰字串的一部分、供辨識用，LM-1C 未另存欄位。認證只比對雜湊，不檢查格式（舊 `sk_` 金鑰仍有效）。
        每個請求依序檢查：金鑰有效 → 連結為 active → scope 足夠 → 資源屬於這條連結。
    productSecret:
      type: http
      scheme: bearer
      description: 產品註冊時取得的密鑰，只用於授權碼換金鑰。

  headers:
    NoStore:
      required: true
      description: 含金鑰、授權碼或聯絡人狀態的回應不可被快取
      schema: { type: string, enum: [no-store] }
    RetryAfter:
      required: true
      description: 幾秒後可重試
      schema: { type: integer, minimum: 1 }

  parameters:
    BotId:
      name: X-Bot-Id
      in: header
      required: true
      description: 必須等於金鑰所屬的 bot（只用於 `/raw/*` 的系統金鑰）
      schema: { type: string }
    LegacyIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: 見 `/raw/push` 說明（舊端點用 `X-` 前綴；新端點 `/messages` 用 `Idempotency-Key`）
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        呼叫端自己決定「同一件事」的定義，例如 `delivery.ready:{project_id}:{contact_ref}:{版次}`。
        同一連結內同一把鍵重送，回傳第一次的結果。上一次還在處理中回 `IN_PROGRESS`；
        同一把鍵配不同內容回 `IDEMPOTENCY_KEY_REUSE`。
      schema: { type: string, maxLength: 128 }

  schemas:
    Scope:
      type: string
      enum: [link:manage, contacts:bind, messages:send, raw:push]
    ContactRef:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: 呼叫端產生的不透明代號，不得含姓名、電話、Email。
      example: ipc_ab12cd34ef
    Link:
      type: object
      required: [link_id, status, scopes, bot_display_name, created_at]
      properties:
        link_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        bot_display_name: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    Notification:
      type: object
      required: [external_contact_ref, event_type, title, body]
      additionalProperties: false
      properties:
        external_contact_ref: { $ref: '#/components/schemas/ContactRef' }
        event_type:
          type: string
          description: 呼叫端定義的事件名稱，僅用於稽核與去重
          pattern: '^[a-z][a-z0-9_.]{0,63}$'
        title: { type: string, maxLength: 40, description: 純文字；上限於 G0 依 LINE 限制確認 }
        body: { type: string, maxLength: 300, description: 純文字；上限於 G0 依 LINE 限制確認 }
        action:
          type: object
          required: [label, url]
          additionalProperties: false
          properties:
            label: { type: string, maxLength: 20 }
            url: { type: string, format: uri, description: https，且網域在產品註冊的白名單內 }
    MessageResult:
      type: object
      required: [message_id, status]
      properties:
        message_id: { type: string }
        status: { type: string, enum: [accepted, sent, failed], description: '`POST /messages` 目前只會回 `sent`（同步送出）' }
        error_code: { type: string, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
    LegacyError:
      type: object
      description: |
        D-7：`/health` 與 `/raw/*` 維持的舊錯誤格式。`error` 是 snake_case 字串（或限流中介層的一句英文），
        可能多帶 `detail`、`reason`、`remaining`、`retryable`、`retryAfter`。不要用在新端點。
      required: [error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }
        detail: { type: string }
        reason: { type: string, enum: [blocked, bot_left] }
        remaining: { type: integer, nullable: true }
        retryable: { type: boolean }
        retryAfter: { type: number }
    RawSendResult:
      type: object
      required: [success, quotaConsumed, remaining]
      properties:
        success: { type: boolean, enum: [true] }
        quotaConsumed: { type: integer, minimum: 0, description: "本次消耗的 LINE 額度；LINE 回報先前已投遞（acceptedEarlier）時為 0" }
        remaining: { type: integer, nullable: true, description: "對帳後剩餘額度；LINE 帳號無額度上限時為 null" }
        acceptedEarlier: { type: boolean, description: LINE 回報這把 retry key 先前已投遞過 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - INVALID_KEY
                - LINK_REVOKED
                - SCOPE_DENIED
                - INVALID_CODE
                - INVALID_REQUEST
                - CONTACT_NOT_BOUND
                - RECIPIENT_BLOCKED
                - INVALID_URL_DOMAIN
                - IN_PROGRESS
                - IDEMPOTENCY_KEY_REUSE
                - NOT_FOUND
                - QUOTA_EXCEEDED
                - RATE_LIMITED
                - INTERNAL
            message: { type: string }
            retryable: { type: boolean }

  responses:
    InvalidRequest:
      description: 請求內容有誤（INVALID_REQUEST / INVALID_CODE）
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InvalidKey:
      description: 金鑰錯誤或已更換（INVALID_KEY）。不區分「不存在」與「已撤銷」。
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: LINK_REVOKED 或 SCOPE_DENIED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 找不到，或不屬於這條連結（NOT_FOUND）
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: INVALID_URL_DOMAIN 或訊息內容不符受限格式
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    QuotaExceeded:
      description: 該 OA 當月推播額度用完（QUOTA_EXCEEDED，當月不可重試）
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: RATE_LIMITED，依 `Retry-After` 重試
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: "INTERNAL（`bridge_not_configured`：資料庫未綁定或查詢失敗）。`retryable: true`"
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    # ── /raw/* 與 /health 的舊格式回應（D-7）──
    RawSent:
      description: "已送出（LINE 已受理）。同鍵重送時帶 `X-Idempotency-Replayed: true`；沒帶 `X-Idempotency-Key` 時帶 `X-Idempotency-Missing: true`"
      headers:
        X-Idempotency-Replayed: { schema: { type: string, enum: ['true'] } }
        X-Idempotency-Missing: { schema: { type: string, enum: ['true'] } }
      content: { application/json: { schema: { $ref: '#/components/schemas/RawSendResult' } } }
    LegacyBadRequest:
      description: "`invalid_request`（含 `detail`）：標頭、JSON、to、messages 有誤，或 LINE 拒絕內容；缺 `X-Bot-Id` 也是 400（`error` 為說明句）"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyUnauthorized:
      description: 金鑰缺漏、錯誤或已撤銷
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyQuotaExhausted:
      description: "`quota_exhausted`（帶 `remaining`），該 OA 當月額度不足；不快取"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyForbidden:
      description: "scope 不足（需 `raw:push`）、`X-Bot-Id` 與金鑰不符、或系統已停用"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyTargetNotFound:
      description: "`target_not_found`：`to` 是 U 開頭但不是這個 bot 的會員（只有 `/raw/push`）"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyConflict:
      description: "`target_inactive`（帶 `reason`：blocked／bot_left，只有 `/raw/push`）或 `in_progress`（同一把鍵仍在處理中）"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyTooLarge:
      description: "`payload_too_large`：本文超過 200000 字元"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyKeyReuse:
      description: "`idempotency_key_reuse`：同一把鍵配不同內容"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyRateLimited:
      description: "超過每 system 限流（`error` 為說明句，帶 `retryAfter`）或 LINE 端限流（`line_rate_limited`）。依 `Retry-After` 重試"
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyBadGateway:
      description: "`line_unavailable`（LINE 無法連線或 5xx；`retryable`）"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
    LegacyUnavailable:
      description: "`bridge_not_configured`：BRIDGE_DB 未綁定，或 bot 沒有可用的 LINE token"
      content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
